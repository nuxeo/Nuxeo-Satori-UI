version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # Pin major Angular versions — upgrade manually
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nx"
        update-types: ["version-update:semver-major"]
      # minimatch 11 removed `makeRe`, which nx calls in three places, and nx pins minimatch to
      # 10.2.5 exactly — 23.3.0 and 24.0.6 both do. Forcing 11 into the tree (an override on
      # `minimatch@^10` reaches that exact pin, because `10.2.5` is a subset of `^10`) kills
      # `nx affected --exclude` with `minimatch_1.minimatch.makeRe is not a function`: CI run
      # 42932394850, where the affected leg died after four green projects and the whole tail
      # silently ran no tests.
      #
      # GHSA-g3hv-75wg-m249 is the advisory that prompted it. Its only patched version is 11.0.1,
      # so there is nothing in the 10.x line to move to — and it is moot here: `npm ls minimatch
      # --omit=dev --all` is empty. Every consumer (nx, @nx/devkit, @typescript-eslint, the
      # @ts-morph under compodoc) is a devDependency, so no customer build reaches it, which is
      # also why `beta:supply-chain` — it gates `npm audit --omit=dev` — does not report it.
      #
      # `versions`, NOT `update-types`, and that distinction is the whole value of this entry. The
      # PR that has to be stopped is a **security** update for the advisory above, not a scheduled
      # major bump, and the reference documents `update-types` concretely only for version
      # updates — the "only affects version updates, not security updates" caveat is written
      # against `allow`, and the `ignore` section never says either way. `versions` is the option
      # whose semantics the docs state plainly ("ignore specific versions or ranges of versions"),
      # so it does not rest on that ambiguity. The alert itself stays visible either way; what is
      # suppressed is the automated PR that would reintroduce the break.
      #
      # Lift this when nx's own pin moves off 10.x.
      - dependency-name: "minimatch"
        versions: [">=11.0.0"]
