name: App definition packages

# The business apps package pipeline's first stage: validate, sign, publish to pre-production
# (docs/business-apps/package-pipeline.md).
#
# - `check`, on every pull request and push that touches a package or what checks one: each
#   package under business-apps/packages/ is checked, built and verified by
#   scripts/app-package.mjs, with Node and the system's unzip, and no install or credential. So a
#   package whose layout names a widget the platform
#   does not have fails here, and the log names the widget: phase 0's demo, step 1. Each package
#   is also compared with what it was: a pull request's base, the commit before a push, or for a
#   tag the package's last release below it. Its version must have moved as far as its changes need
#   (package-pipeline.md, section 8), and what changed is written beside the zip and in the job's
#   summary. The upgrade is checked against the same commit (section 10): what a customer may
#   override or name in the package, and what the package names of the platform, is removed only
#   with a migration note and the version it needs, so the platform's sources are paths here too.
# - `sign-and-publish`, only for a tag `app-package/<name>/<version>`, which someone pushes on
#   purpose: a build provenance attestation for the zip, then Nuxeo Marketplace preprod, the way
#   build-marketplace.yml publishes the platform's own package. Nothing publishes on a merge,
#   because a build nobody asked for does not belong in the shared preprod list.
#
# The second job never runs a package's code. It downloads the zip the first job built, checks its
# checksum, and signs and publishes that, so the secrets are never in the same job as a package's
# build.mjs. The first job runs only a build.mjs that is byte for byte the generator's.
#
# The `paths` lists are duplicated rather than shared: GitHub Actions does not resolve YAML anchors.
# A tag push is not filtered by paths.

on:
  pull_request:
    paths:
      - 'business-apps/packages/**'
      - 'libs/shared/app-definition/src/**'
      - 'libs/platform/package.json'
      - 'scripts/app-package.mjs'
      - 'scripts/app-package.selftest.mjs'
      - 'scripts/app-package-model.mjs'
      - 'scripts/nuxeo-content-model.mjs'
      - 'scripts/beta-harness/nuxeo-credentials.mjs'
      - 'scripts/verify-package-zip.mjs'
      - 'scripts/app-upgrade-check.mjs'
      - 'scripts/app-upgrade-check.selftest.mjs'
      - 'docs/extension-reference.md'
      - 'docs/business-apps/platform-upgrade-notes.json'
      - 'nuxeo-agentic-core/src/main/**'
      - 'apps/nuxeo-ui/src/app/business-apps.menu.ts'
      - 'apps/nuxeo-ui/public/i18n/en.json'
      - 'tools/satori-generators/src/config-package/files/build.mjs__tmpl__'
      - '.github/workflows/app-packages.yml'
  push:
    branches: [main, 'integration/**']
    tags: ['app-package/**']
    paths:
      - 'business-apps/packages/**'
      - 'libs/shared/app-definition/src/**'
      - 'libs/platform/package.json'
      - 'scripts/app-package.mjs'
      - 'scripts/app-package.selftest.mjs'
      - 'scripts/app-package-model.mjs'
      - 'scripts/nuxeo-content-model.mjs'
      - 'scripts/beta-harness/nuxeo-credentials.mjs'
      - 'scripts/verify-package-zip.mjs'
      - 'scripts/app-upgrade-check.mjs'
      - 'scripts/app-upgrade-check.selftest.mjs'
      - 'docs/extension-reference.md'
      - 'docs/business-apps/platform-upgrade-notes.json'
      - 'nuxeo-agentic-core/src/main/**'
      - 'apps/nuxeo-ui/src/app/business-apps.menu.ts'
      - 'apps/nuxeo-ui/public/i18n/en.json'
      - 'tools/satori-generators/src/config-package/files/build.mjs__tmpl__'
      - '.github/workflows/app-packages.yml'

concurrency:
  group: app-packages-${{ github.ref }}
  # A publish is never cancelled half way.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  check:
    name: Check, build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # The token is not kept in .git/config, where what this job runs could reach it.
          persist-credentials: false

      # No `registry-url:`, which would write an `.npmrc` with an auth line.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Asserted rather than described, as configuration-packages.yml does: an install added to
      # this job would make it test something a customer's repository does not have.
      - name: Check this job has no install and no credential
        run: |
          set -euo pipefail
          if [ -d node_modules ]; then
            echo "::error::node_modules exists: this job checks packages with Node alone"; exit 1
          fi
          for var in NODE_AUTH_TOKEN NPM_TOKEN SATORI_GH_READONLY_TOKEN NPM_PACKAGES_TOKEN GITHUB_PACKAGES_TOKEN; do
            if [ -n "${!var:-}" ]; then
              echo "::error::$var is set; this job must have no credential in scope"; exit 1
            fi
          done
          if git config --get-regexp '^http\..*\.extraheader$' >/dev/null; then
            echo "::error::the checkout left a credential in .git/config"; exit 1
          fi
          if ! command -v unzip >/dev/null; then
            echo "::error::unzip is missing, and step 5 reads the zip back with it"; exit 1
          fi
          echo "No node_modules, no token and no stored credential. Node $(node --version)."

      - name: Controls for the pipeline
        run: |
          set -euo pipefail
          node scripts/app-package.selftest.mjs
          node scripts/app-upgrade-check.selftest.mjs

      - name: Check, build and verify each package
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          platform=$(node -p "require('./libs/platform/package.json').version")
          tag=''
          if [[ "$GITHUB_REF" == refs/tags/app-package/* ]]; then tag="${GITHUB_REF#refs/tags/}"; fi
          # What each package's version is held to: the commit a pull request is based on, the one
          # before a push (none for a new branch), or for a tag the package's last release, below.
          base=''
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then base="$PR_BASE"
          elif [ -z "$tag" ] && [[ ! "${BEFORE:-0}" =~ ^0+$ ]]; then base="$BEFORE"; fi
          if [ -n "$base" ] && ! git fetch --no-tags --depth=1 origin "$base"; then
            echo "::warning::$base could not be fetched, so no version is held to what it was."
            base=''
          fi
          previous_root=$(mktemp -d)
          built=0
          for dir in business-apps/packages/*/; do
            dir="${dir%/}"
            name=$(basename "$dir")
            args=(--out dist/app-packages --platform "$platform")
            if [ -n "$tag" ]; then
              # A tag publishes the one package it names.
              [[ "$tag" == "app-package/$name/"* ]] || continue
              args+=(--tag "$tag")
              # Held to the last release below it, a prerelease's tag as a release's: the first tag
              # after this one in descending version order (a prerelease before its release, as
              # versionsort.suffix says) whose version has no prerelease, a "-" before any "+"
              # build metadata. Held to the prerelease
              # just before it instead, a release could carry through its prereleases what the
              # release before it would refuse.
              if ! git fetch --no-tags --depth=1 origin "+refs/tags/app-package/$name/*:refs/tags/app-package/$name/*"; then
                echo "::warning::the tags of $name could not be fetched, so its version is held to no earlier tag."
              fi
              base=$(git -c versionsort.suffix=- tag --list "app-package/$name/*" --sort=-v:refname \
                | awk -v tag="$tag" 'seen && $0 !~ /\/[^\/+]*-[^\/]*$/ { print; exit } $0 == tag { seen = 1 }')
            fi
            # Where the package was at the base: its own folder, or the folder of the package of the
            # same name, so that renaming a kit's folder does not make it a new package held to nothing.
            was=''
            if [ -n "$base" ]; then was=$(node scripts/app-upgrade-check.mjs --place-at "$base" "$dir"); fi
            if [ -n "$was" ]; then
              git archive "$base" "$was" | tar -x -C "$previous_root"
              # And the platform as it was at the same commit, for the upgrade check's platform side.
              platform_root="$previous_root/platform-$name"
              node scripts/app-upgrade-check.mjs --export "$base" "$platform_root"
              args+=(--previous "$previous_root/$was" --previous-platform "$platform_root")
              echo "$name: its version and its upgrade are held to $was at $base."
            else
              echo "$name: nothing to hold its version to${base:+ at $base}, so it is a new package."
            fi
            node scripts/app-package.mjs "$dir" "${args[@]}"
            built=$((built + 1))
          done
          if [ "$built" -eq 0 ]; then
            echo "::error::No package was built${tag:+: $tag names no directory under business-apps/packages/}."
            exit 1
          fi
          for changes in dist/app-packages/*.changes.md; do
            if [ -f "$changes" ]; then cat "$changes" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: app-packages
          path: dist/app-packages/
          retention-days: 30
          if-no-files-found: error

  sign-and-publish:
    name: Sign and publish to preprod
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/app-package/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-packages
          path: packages

      - name: Check the zip is the one the check job built
        id: zip
        run: |
          set -euo pipefail
          named="${GITHUB_REF#refs/tags/app-package/}"
          zip="packages/${named%%/*}-${named#*/}.zip"
          if [ ! -f "$zip" ]; then echo "::error::$zip was not built"; exit 1; fi
          (cd packages && sha256sum -c "$(basename "$zip").sha256")
          echo "path=$zip" >> "$GITHUB_OUTPUT"

      # Signed: an attestation, by GitHub's Sigstore, that this repository's workflow built this
      # zip from this commit. Anyone can check it with
      # `gh attestation verify <zip> --repo nuxeo/Nuxeo-Satori-UI`.
      - name: Sign the zip
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.zip.outputs.path }}

      - name: Publish to Nuxeo Marketplace (preprod)
        uses: Alfresco/alfresco-build-tools/.github/actions/nuxeo/nos-publish@v12.10.3
        with:
          nos-env: staging
          nos-username: ${{ secrets.CONNECT_PREPROD_USERNAME }}
          nos-token: ${{ secrets.CONNECT_PREPROD_PASSWORD }}
          skip-verify: 'false'
          package-path: ${{ steps.zip.outputs.path }}
