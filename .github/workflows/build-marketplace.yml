name: Build Marketplace Package

on:
  # Build-only validation, so a PR that breaks the Maven package is caught before merge.
  # Never publishes — see the `if` on `push-to-preprod`. PRs into an `integration/<ticket>`
  # or a `staging/<name>` branch get the same validation as PRs into `main`. Until 26 November
  # 2026 `staging/**` was missing, as it was from ci.yml until #738: every add-on merged into
  # `staging/enterprise-grade-app` had its Maven tests run only on its author's machine.
  pull_request:
    branches:
      - main
      - 'integration/**'
      - 'staging/**'

  # The only lane that can publish, and the only lane that runs for `main`. There is
  # deliberately no `push` trigger: every merge to `main` used to build and publish a
  # timestamped package, which filled Marketplace preprod with builds nobody asked for.
  # Publishing is now always someone asking for it — here, or from `release.yml`, which
  # dispatches this workflow with publishToPreprod=true.
  workflow_dispatch:
    inputs:
      publishToPreprod:
        description: 'Publish the built package to Nuxeo Marketplace preprod'
        type: boolean
        default: false

concurrency:
  group: marketplace-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: >-
    -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
    -Daether.syncContext.named.time=600
    -Xms512m -Xmx1g

permissions:
  contents: read
  packages: read
  checks: write
  pull-requests: write

jobs:
  properties:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.env.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version info
        id: env
        run: |
          set -e
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | grep -v '\[' | head -n 1 | xargs)
          BASE_VERSION=${CURRENT_VERSION%-SNAPSHOT}

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            VERSION="${BASE_VERSION}-PR-${{ github.event.number }}-BUILD-${{ github.run_number }}"
          else
            # Base plus timestamp, whatever the branch. Branch builds used to carry a slug of
            # the ref — `2026.0.1-adf-hx-browse-poc-20260906145744` — so that they could be
            # told apart from `main` builds in the shared preprod list. That made the internal
            # branch name a customer-visible string on the Marketplace listing, which is worse
            # than the ambiguity it solved. The publishing run is recorded in Actions; the
            # version does not have to carry it.
            #
            # The run number is what the dropped slug had been doing for uniqueness. The
            # `concurrency` group above is keyed on `github.ref`, so it serialises publishes
            # from one ref and nothing at all across two — dispatch from `main` and from a
            # branch in the same second and a timestamp alone resolves to the same string on
            # both, which is a colliding upload rather than an ambiguous listing. Run numbers
            # are unique per workflow across every ref, so the suffix is branch-neutral and
            # the timestamp still orders the list.
            VERSION="${BASE_VERSION}-$(date +%Y%m%d%H%M%S)-BUILD-${{ github.run_number }}"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: properties
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.properties.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@hylandsoftware'

      - name: Update Maven version
        run: mvn versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false

      - name: Update package.xml version
        run: |
          PACKAGE_XML="nuxeo-agentic-ui-package/src/main/resources/package.xml"
          sed -i "s/version=\"[^\"]*\"/version=\"$VERSION\"/" "$PACKAGE_XML"

      - name: Install npm dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.SATORI_GH_READONLY_TOKEN }}
          SATORI_GH_READONLY_TOKEN: ${{ secrets.SATORI_GH_READONLY_TOKEN }}

      - name: Build Angular application
        run: npx nx build nuxeo-ui --configuration=production --base-href=/nuxeo/agentic-ui/

      # The embedded panel's one script, which the UI package serves at
      # /nuxeo/agentic-ui/embedded/v1/ (its assembly reads dist/nuxeo-embedded-panels/browser). The
      # package's build below does not reach the frontend module, so it is built here, as the app is.
      - name: Build the embedded panel
        run: npx nx build nuxeo-embedded-panels --configuration=production

      - name: Build Maven package
        run: |
          mvn clean package -pl nuxeo-agentic-ui-package -am -B -V -nsu --no-transfer-progress
          ls nuxeo-agentic-ui-package/target/*.zip
          # The panel's script travels in the package, or a host page has nothing to load.
          if ! unzip -l nuxeo-agentic-ui-package/target/*.zip | grep -q 'web/nuxeo.war/agentic-ui/embedded/v1/main.js'; then
            echo "The UI package does not carry the embedded panel's main.js"; exit 1
          fi

      # The assets module's server add-on is its own Marketplace package (decision B's
      # recommendation), so the UI package's build above does not reach it. Built here so that its
      # tests run on every pull request this workflow sees; its zip is not uploaded or published.
      - name: Build and test the assets add-on
        run: |
          mvn package -pl nuxeo-agentic-assets -am -B -nsu --no-transfer-progress
          ls nuxeo-agentic-assets/target/nuxeo-agentic-assets-*.zip

      # The records module's add-on, the same way: its tests run in Nuxeo's own test framework, a
      # repository with the platform's retention and holds, and read the retention module's model
      # from its published jar, held to the SHA-256 its pom names.
      - name: Build and test the records add-on
        run: |
          mvn package -pl nuxeo-agentic-records -am -B -nsu --no-transfer-progress
          ls nuxeo-agentic-records/target/nuxeo-agentic-records-*.zip

      # The document control module's add-on, likewise its own package. Its tests start a Nuxeo
      # runtime and repository (VCS on H2) in the build's JVM, the concurrency test among them, so
      # it takes a minute or two more than the others; its zip is not uploaded or published.
      - name: Build and test the document control add-on
        run: |
          mvn verify -pl nuxeo-agentic-documents -am -B -nsu --no-transfer-progress
          ls nuxeo-agentic-documents/target/nuxeo-agentic-documents-*.zip

      # The connectors module's add-on, a bundle of its own that the UI package above does not
      # take in, so its tests ran nowhere in CI before 26 November 2026.
      - name: Build and test the connectors add-on
        run: |
          mvn verify -pl nuxeo-agentic-connectors -am -B -nsu --no-transfer-progress
          ls nuxeo-agentic-connectors/target/nuxeo-agentic-connectors-*.jar

      # The e-signature step's add-on, likewise its own package. Its tests start a Nuxeo runtime,
      # call the stand-in provider over the loopback interface, and run the stand-in service,
      # demo/esign-stand-in.mjs, with the Node this job set up; its zip is not uploaded or published.
      - name: Build and test the e-signature add-on
        run: |
          mvn verify -pl nuxeo-agentic-signature -am -B -nsu --no-transfer-progress
          ls nuxeo-agentic-signature/target/nuxeo-agentic-signature-*.zip
          node nuxeo-agentic-signature/demo/esign-stand-in.selftest.mjs

      # Capture and classification's add-on, likewise its own package. Its tests start a Nuxeo
      # runtime with the Automation service and the platform's audit, classify with the stand-in,
      # and call the AI provider only against the tests' own stand-ins for the AI package's
      # operations: no AI service is reached. Its zip is not uploaded or published.
      - name: Build and test the capture add-on
        run: |
          mvn verify -pl nuxeo-agentic-capture -am -B -nsu --no-transfer-progress
          ls nuxeo-agentic-capture/target/nuxeo-agentic-capture-*.zip

      # Embedded panels' token exchange (decision F), an add-on of its own with no Marketplace
      # package yet: its jar, after its tests, with no Nuxeo runtime. The jar must not carry the
      # compile-time copy of the platform's authentication plugin interface.
      - name: Build and test the embedded panels add-on
        run: |
          mvn verify -pl nuxeo-agentic-embedded -am -B -nsu --no-transfer-progress
          ls nuxeo-agentic-embedded/target/nuxeo-agentic-embedded-*.jar
          if unzip -l nuxeo-agentic-embedded/target/nuxeo-agentic-embedded-*.jar | grep -q 'org/nuxeo/ecm/'; then
            echo "The add-on's jar carries the compile-time copy of a platform interface"; exit 1
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuxeo-agentic-ui-package
          path: nuxeo-agentic-ui-package/target/*.zip
          retention-days: 30
          if-no-files-found: error

  push-to-preprod:
    needs: [properties, build]
    runs-on: ubuntu-latest
    # Nothing publishes on its own, `main` included: the branch only decides how the version
    # is stamped, never whether it ships. PR runs can never reach this job.
    # Compares against the string: `github.event.inputs` stringifies booleans, so
    # `== true` would never match, whether dispatched from the UI or `gh workflow run`.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publishToPreprod == 'true'
    env:
      VERSION: ${{ needs.properties.outputs.VERSION }}
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: nuxeo-agentic-ui-package
          path: packages

      - name: Publish to Nuxeo Marketplace (Preprod)
        uses: Alfresco/alfresco-build-tools/.github/actions/nuxeo/nos-publish@v12.10.3
        with:
          nos-env: staging
          nos-username: ${{ secrets.CONNECT_PREPROD_USERNAME }}
          nos-token: ${{ secrets.CONNECT_PREPROD_PASSWORD }}
          skip-verify: 'false'
          package-path: packages/nuxeo-agentic-ui-package-${{ env.VERSION }}.zip
