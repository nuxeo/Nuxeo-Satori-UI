name: Changelog Agent

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    # Only run if the push was not from the changelog bot itself
    if: "!contains(github.event.head_commit.message, 'chore: update CHANGELOG')"
    steps:
      - name: Require bot token
        env:
          BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          if [[ -z "$BOT_GITHUB_TOKEN" ]]; then
            echo "::error::secrets.BOT_GITHUB_TOKEN is required to push the changelog branch and open a PR."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate changelog from Conventional Commits
        run: |
          npx --yes conventional-changelog-cli \
            -p angular \
            -i CHANGELOG.md \
            -s \
            --commit-path . \
            || echo "No conventional commits found — CHANGELOG.md unchanged."

      - name: Open or update changelog pull request
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "CHANGELOG.md is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="chore/update-changelog"
          git switch --create "$branch"
          git add CHANGELOG.md
          git commit -m "chore: update CHANGELOG"
          git push --force origin "$branch"

          pull_request="$(gh pr list --state open --base main --head "$branch" --json number --jq '.[0].number // empty')"
          if [[ -n "$pull_request" ]]; then
            gh pr edit "$pull_request" \
              --title "chore: update CHANGELOG" \
              --body "Generated from Conventional Commits by the Changelog Agent."
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: update CHANGELOG" \
              --body "Generated from Conventional Commits by the Changelog Agent."
          fi
