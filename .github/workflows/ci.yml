name: CI

on:
  # `integration/<ticket>` branches collect a ticket's PRs and reach `main` as one PR (see
  # AGENTS/06-git-workflow.md), so a PR into one needs the same gate as a PR into `main`.
  # nx-set-shas diffs a PR against its own base branch, so the affected set is the sub-PR's
  # change, not the whole integration branch.
  pull_request:
    branches: [main, 'integration/**']
  # Long-lived feature branches are validated on push as well as on PR, so work in
  # progress is never only "green on my machine". nx-set-shas falls back to comparing
  # against the default branch when a push has no previous successful run to diff from.
  #
  # NOTE: a branch with an open PR is therefore gated twice, once per event, and the two runs
  # do not cancel each other because `github.ref` is `refs/heads/<branch>` on push and
  # `refs/pull/<n>/merge` on a pull_request, which puts them in different concurrency groups.
  # That duplication is deliberate only up to a point — the push run is the sole gate before a
  # PR exists, and it is redundant after — and it is NOT addressed here. Measured on
  # 2026-10-27: push run 40393849591 and pull_request run 40393859028 of the same commit ran
  # the same 21 steps to the same conclusions with every duration within 10% of its pair.
  push:
    branches: [main, 'feature/**', 'fix/**', 'integration/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, explicitly. Without this block the job inherits the repository default, which
# can be read/write on `contents` — a workflow that only needs to read the code would be able to
# push to it. Flagged by CodeQL's `actions/missing-workflow-permissions`, and this was the only
# workflow of the nine that lacked it.
permissions:
  contents: read
  # `npm ci` resolves @hylandsoftware from GitHub Packages.
  packages: read
  # `nrwl/nx-set-shas` calls the workflow-runs API to find the last successful run to diff
  # against. Without this it fails with `Resource not accessible by integration`, which is
  # exactly what happened when this block was first added with `contents: read` alone —
  # tightening permissions broke the build on the very next push.
  actions: read

# This was one `lint-build-test` job running 21 steps in sequence, and four of those steps were
# 82% of its wall clock: Storybook interactions 413 s, affected tests 329 s, the static beta
# gates 328 s and the i18n guardrail controls 212 s, out of 1555 s total (run 40393849591,
# 2026-10-27). None of the four needs anything another produces — the three non-Storybook ones
# are plain `node scripts/...` invocations that need `node_modules` and nothing else — so the
# sum was paid for no reason other than them sharing a runner.
#
# Split into six work jobs behind one cheap `base` job, the wall clock becomes the longest
# chain rather than the total. Measured at 7.4 min on run 40447149034 against the 26 min
# baseline, then sharded again: `static-gates` was that run's critical path at 430 s, so the
# sanitizer pair that accounts for most of it moved to its own job. The trade is runner
# minutes, which go UP — about 5 per run for the first split and ~1 more for this shard,
# because each job pays its own ~65 s of checkout plus `npm ci`. That is the whole of the cost
# and it is worth naming rather than discovering.
#
# Second, smaller consequence, and an improvement: a failure no longer short-circuits the steps
# after it. A red static gate used to mean the Storybook and test steps never ran, so one
# failure hid every other, and the Storybook timeouts recorded below were masked on
# `integration/**` by exactly that. Each job now reports its own verdict on every run.
#
# Two orderings are load-bearing and are preserved INSIDE their jobs, not across them; both are
# commented where they live. The whole job graph, with measured times from run 40447149034
# (a YAML-only change, so `satori-components` was unaffected and `storybook` skipped its two
# heavy steps — on a run that touches it, expect ~9 min there and the critical path with it):
#
#   base ──┬── guardrails       250 s  review guardrails and the offline controls
#          ├── static-gates     ~3 min the static beta gates, less the sanitizer pair
#          ├── sanitizer-gates  ~5 min the sanitizer audit and its controls
#          ├── verify           122 s  lint, build, typecheck, package, bundle size
#          ├── test             200 s  affected tests
#          └── storybook        72 s   token-free build, publication gate, interactions
#
# So the floor is no longer this file's shape. With the sanitizer pair on its own runner the
# two longest things left are `sanitizer-audit.selftest.mjs` at ~190 s and the i18n guardrail
# controls at ~177 s, each a single script inside a job that cannot be split further. Anything
# faster than ~4 min means making one of those two cheaper, not adding jobs.
jobs:
  # nx-set-shas resolved ONCE and handed to every job, rather than in each of the six.
  #
  # Not a micro-optimisation: it asks the workflow-runs API for the last successful run of this
  # workflow to diff against, so five concurrent calls can legitimately return different answers
  # if a run completes while they are in flight. The affected set would then differ between the
  # lint job and the test job, which fails as "lint ran for a project its tests did not" — a
  # genuinely baffling report. One resolution, five consumers, no divergence possible.
  #
  # No `npm ci` here: nx-set-shas is a bundled JS action. ~25 s, and it is the only serial
  # section of the graph.
  base:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.shas.outputs.base }}
      head: ${{ steps.shas.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v4

      # Read back from the environment nx-set-shas exports rather than from its declared
      # action outputs. $NX_BASE/$NX_HEAD is the contract the single-job workflow relied on for
      # every one of its steps, so it is the half proven in this repository.
      - name: Publish the affected SHAs to the dependent jobs
        id: shas
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NX_BASE:-}" || { echo "nx-set-shas did not export NX_BASE"; exit 1; }
          test -n "${NX_HEAD:-}" || { echo "nx-set-shas did not export NX_HEAD"; exit 1; }
          echo "base=$NX_BASE" >> "$GITHUB_OUTPUT"
          echo "head=$NX_HEAD" >> "$GITHUB_OUTPUT"
          echo "NX_BASE=$NX_BASE NX_HEAD=$NX_HEAD"

  # The review guardrails and the controls that prove each of them can still fail.
  guardrails:
    needs: base
    runs-on: ubuntu-latest
    env:
      NX_BASE: ${{ needs.base.outputs.base }}
      NX_HEAD: ${{ needs.base.outputs.head }}
    steps:
      # Must precede the local composite action below. The runner resolves
      # ./.github/actions/setup from the workspace, so the repository has to be on disk
      # before that step can be loaded at all.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          github-packages-token: ${{ secrets.SATORI_GH_READONLY_TOKEN }}
          base: ${{ needs.base.outputs.base }}
          head: ${{ needs.base.outputs.head }}

      - name: Run review guardrails
        run: npm run review:guardrails -- --base=$NX_BASE --head=$NX_HEAD

      # The guardrails' own negative controls. Without this step CI enforces the guardrails but
      # never checks they are capable of failing, which is how a guardrail regresses into an
      # always-green implementation with the required check still reported as passing.
      # Builds throwaway git repositories under the runner's temp dir; touches nothing tracked.
      - name: Run Satori rename codemod controls
        run: node --test scripts/rename-satori.selftest.mjs

      - name: Run i18n guardrail negative controls
        run: npm run review:guardrails-selftest

      # Same argument one level down: the Crowdin context push is the only part of the
      # localization pipeline with logic in it, and it cannot be exercised end to end until a
      # Crowdin project exists.
      - name: Run Crowdin context push controls
        run: npm run review:crowdin-selftest

      # Tooling that runs outside CI — the review-loop harvest and the Confluence publisher both
      # need credentials CI does not have — so these offline controls are the only part of either
      # that CI can exercise. The harvest silently dropped every "Previously missed" finding, and
      # the publisher linked a branch frozen 1364 commits behind main; nothing that ran saw either.
      - name: Run review-harvest and Confluence link controls
        run: |
          set -euo pipefail
          npm run review:analysis-selftest
          npm run docs:links-selftest
          npm run docs:storage-selftest

  # Static checks that `beta:gate` has run locally since Phase 5 and that had
  # never run here. They are seconds each and they close a specific hole: the local
  # gate and CI were two different gates, so "green locally" and "green in CI" made
  # different claims and neither said so. A check that only ever runs on one
  # developer's machine is a check that stops running the day they stop running it.
  #
  # The sanitizer pair — now its own `sanitizer-gates` job below — reproduced that hole
  # exactly. Both were registered in `verify-gate.mjs`'s ALL_GATES and in
  # `review:preflight`, and CI invokes neither — it runs individual scripts. So
  # "registered as a gate" meant local-only, and review had to point out that the gate
  # guarding a shipped XSS-adjacent defect could not block a merge. Registering a check in
  # ALL_GATES is not the same as running it.
  #
  # WHY THE SANITIZER PAIR IS A SEPARATE JOB, and why there are two shards rather than four:
  # these gates were one 365 s step, and the cost is not spread across them. Timed
  # individually (local, 2026-10-27, 296 s total): `beta:sanitizers-selftest` alone is 190 s —
  # 64% of everything here — then dependency-tree 16 s and its controls 17 s, supply-chain
  # 15 s, customer-guardrails 8 s, sanitizers 7 s, and all thirteen others at 3 s or less.
  # (`beta:identity-guard-selftest` measured 29 s but exited 1 locally, on the Node 25
  # built-in `localStorage` that shadows jsdom's; CI pins Node 24 and it passes there, so
  # that figure is a fail-fast path and not its real cost.)
  #
  # One script holding two thirds of the time cannot be sharded, so it sets the floor: the
  # sanitizer shard lands near 5 min and this one near 3, which puts the critical path at
  # the sanitizer selftest rather than at a balanced pair. Splitting the remaining eighteen
  # further would add runner minutes and shorten nothing — the same reason a remote cache was
  # not worth buying. If this job's 5 min is ever the thing in the way, the work is inside
  # `sanitizer-audit.selftest.mjs`, not in this file.
  static-gates:
    needs: base
    runs-on: ubuntu-latest
    env:
      NX_BASE: ${{ needs.base.outputs.base }}
      NX_HEAD: ${{ needs.base.outputs.head }}
    steps:
      # Must precede the local composite action below. The runner resolves
      # ./.github/actions/setup from the workspace, so the repository has to be on disk
      # before that step can be loaded at all.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          github-packages-token: ${{ secrets.SATORI_GH_READONLY_TOKEN }}
          base: ${{ needs.base.outputs.base }}
          head: ${{ needs.base.outputs.head }}

      # No `SANITIZER_AUDIT_BASE_REF` here: the only two readers of it are
      # `sanitizer-audit.mjs` and `sanitizer-audit.selftest.mjs`, and both moved to
      # `sanitizer-gates`. Setting it on this job as well would read as though something
      # here depended on it.
      - name: Static beta gates (evidence, reference drift, Satori comparison page, customer guardrails, supply chain, lockfile and dependency-tree controls)
        run: |
          set -euo pipefail
          # The lockfile gate and its controls. `npm ci` above already proves this lock installs
          # on Linux, which is the failure the gate was written for — but it says nothing about
          # the gate still being able to report, and that half has been wrong twice: once green
          # on the lock that broke Phase 2, once waiving every `brace-expansion` major because
          # the override selector was stripped. The controls are the only thing that re-asserts it.
          npm run beta:lockfile
          npm run beta:lockfile-selftest
          # NXSAT-308 criterion 3: no adf-hx, adf-core, adf-extensions, js-api or hxcs-js-client in
          # the lock, the installed tree `npm ci` just produced, a manifest, .npmrc or an import.
          # BLOCKING since the ADF removal (NXSAT-638) set `BLOCKING` in the script: any finding
          # fails it, and so does a location that cannot be read. The controls are what prove each
          # location can still find something, so a scanner that finds nothing cannot stay green.
          npm run beta:dependency-tree
          npm run beta:dependency-tree-selftest
          # Fails if an evidence step asserts something it cannot observe. Phase 1 shipped
          # a dead feature past two checks that certified properties they could not see.
          npm run beta:audit
          # And its own negative controls, for the same reason the sanitizer pair below has
          # them: this audit's guard exemption has been wrong four times, and every time the
          # hole was found by someone trying an input rather than by anything that runs. The
          # line above verifies the audit runs; this one verifies it can still report — and
          # that the constants it deliberately does NOT decide are still printed as such.
          npm run beta:audit-selftest
          # The one steps file that captures the same claims on two sets of components, held to
          # the rule that only its surface adapter differs between the halves. Nothing enforced
          # that, and the nxs parity run could not finish for two months: a crumb selected by a
          # label that was itself under test aborted it on a timeout, eleven of twenty-four steps
          # never ran, and a permission option matched by its translated label staged no change —
          # so the save under test never happened and the check on it passed on an untouched ACL.
          npm run beta:parity-surface
          # And its controls, for the reason the pair above has them: the defects it guards were
          # in a file nothing audited, so a guard that could not itself go red is the same mistake.
          npm run beta:parity-surface-selftest
          # And step 11's own save verdict, which the audit above structurally cannot judge: it
          # checks the file's shape, not whether a verdict in it can be wrong. This runs
          # `aclSaveVerdict` against each situation the step can observe and prints what the old
          # predicate — the one that passed on an ACL nobody had touched — would have concluded.
          # ~50 ms, in process, no browser and no backend.
          npm run beta:parity-selftest
          # The identity guard's offline controls (NXSAT-643): a guard that accepts Anonymous, or a
          # step boundary that goes unchecked, is green on every capture it is supposed to reject.
          # The live half (`beta:identity-guard-controls`) needs a guest-enabled Nuxeo CI lacks.
          npm run beta:identity-guard-selftest
          # The only customer-facing document nothing checked. When first measured it was
          # wrong in both directions.
          npm run beta:reference
          # The same for the Confluence page showing each nxs- component with and without Satori:
          # a section per barrel component and none for a removed one, with its controls.
          npm run docs:satori-comparison:check
          npm run docs:satori-comparison:selftest
          # The guardrail we hand customers, run against our own reference library — so we
          # do not learn it is broken from a customer's CI log.
          npm run beta:customer-guardrails
          # The command that regenerates the shared derived files after a merge, held to its
          # derived-file list and its conflict handling.
          npm run sync:derived-selftest
          # The gate runner's own counting: a gate that reports NOT RUN is never counted green,
          # and a run containing one is `pass-incomplete`, not `pass`.
          npm run beta:gate-selftest
          # The Storybook publication gate's controls: each Satori fingerprint must fail it.
          npm run storybook:publication-gate-selftest
          # The root ESLint config against a deleted `@hylandsoftware` scope, which is the state
          # the Material Storybook build creates on purpose. Both directions: it must load with
          # the package absent, and it must still carry the Satori rules when it is installed.
          # Runs here, with every other static gate, because it is fast and needs no build.
          #
          # NOT because this file reaches no affected-based job: `nx show projects --affected
          # --files eslint.config.mjs` reports every project in the workspace, 32 of 32, so the
          # storybook job below does build on a change to it. What stopped that job catching the
          # 2026-10-25 break was the warm project graph: it resolved its affected set while
          # `@hylandsoftware` was installed and reused that cache after removing the scopes, so it
          # never re-read the config with the scope absent. The build step computes its graph cold
          # now, so it does exercise the guard — these fixtures are the proof that does not depend
          # on that step order holding.
          npm run lint:config-selftest
          # SCA. Fails on a high or critical in the PRODUCTION tree, and on an accepted
          # advisory whose review date has expired. Gating on the dev-inclusive total
          # instead would be permanently red (9 high, none shipped) and so bypassed.
          # Also fails on a production dependency nothing imports — which is how `cors`
          # and `dotenv` were found, two beyond the two already recorded as debt.
          npm run beta:supply-chain

  # The sanitizer audit and its negative controls, on their own runner.
  #
  # Not a thematic split: the controls alone are 190 s of the 296 s all of these static gates
  # cost together, so leaving them in `static-gates` meant every other gate there waited
  # behind them. The measurement and what follows from it are above `static-gates`.
  #
  # Both scripts stay in ONE job and in this order. `beta:sanitizers` is the audit and
  # `beta:sanitizers-selftest` is the half that proves the audit can still fail; a run that
  # reported the first without the second is the state review already caught once, so there is
  # no version of this split that separates them.
  sanitizer-gates:
    needs: base
    runs-on: ubuntu-latest
    env:
      NX_BASE: ${{ needs.base.outputs.base }}
      NX_HEAD: ${{ needs.base.outputs.head }}
    steps:
      # Must precede the local composite action below. The runner resolves
      # ./.github/actions/setup from the workspace, so the repository has to be on disk
      # before that step can be loaded at all.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          github-packages-token: ${{ secrets.SATORI_GH_READONLY_TOKEN }}
          base: ${{ needs.base.outputs.base }}
          head: ${{ needs.base.outputs.head }}

      - name: Sanitizer audit and its negative controls
        env:
          # The sanitizer budget ratchet compares against the merge base with `origin/main` by
          # default. A PR into an integration branch must be ratcheted against that branch, or a
          # budget change already accepted there is charged again to every later sub-PR. Empty on
          # push, where the default applies; `origin/main` on a PR into `main`, as before.
          SANITIZER_AUDIT_BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
        run: |
          set -euo pipefail
          # Every `bypassSecurityTrust*` call is registered with a justification, no Safe* value
          # reaches a SecurityContext.NONE binding, trusted HTML traces back to a sanitiser, and
          # the debt budgets have not been raised against the merge base.
          npm run beta:sanitizers
          # And the audit's own negative controls, so it cannot regress into an always-green
          # implementation while the line above keeps passing. This is the load-bearing half:
          # without it CI verifies the audit runs, not that it can fail.
          npm run beta:sanitizers-selftest

  # Lint, build and typecheck, then the published-package checks and the bundle ceiling.
  #
  # These five steps stay in ONE job because the last three share `dist/` and the ordering
  # between them is load-bearing — see the two comments inside. Splitting them would mean
  # rebuilding `platform` and `nuxeo-ui` in separate jobs to no benefit: together they are
  # ~130 s, nowhere near the Storybook critical path.
  verify:
    needs: base
    runs-on: ubuntu-latest
    env:
      NX_BASE: ${{ needs.base.outputs.base }}
      NX_HEAD: ${{ needs.base.outputs.head }}
    steps:
      # Must precede the local composite action below. The runner resolves
      # ./.github/actions/setup from the workspace, so the repository has to be on disk
      # before that step can be loaded at all.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          github-packages-token: ${{ secrets.SATORI_GH_READONLY_TOKEN }}
          base: ${{ needs.base.outputs.base }}
          head: ${{ needs.base.outputs.head }}

      - name: Lint affected projects
        run: npx nx affected -t lint --base=$NX_BASE --head=$NX_HEAD

      - name: Build affected projects
        run: npx nx affected -t build --base=$NX_BASE --head=$NX_HEAD

      # `test` does NOT typecheck — vitest strips types through esbuild — and most
      # libraries have no `build` target, so before this step a type error confined to a
      # library reached `main` unless `nuxeo-ui`'s build happened to import it.
      - name: Typecheck affected projects
        run: npx nx affected -t typecheck --base=$NX_BASE --head=$NX_HEAD

      # The three checks that guard the published package. Run unconditionally rather
      # than only when affected: they are ~30s in total, and they are the checks that
      # catch the expensive class of defect — both of the ones below were configuration
      # *absent* rather than wrong, so no compiler reported either, and every other gate
      # in this file was green through both.
      #
      # MUST stay above "Check bundle size", which starts with `rm -rf dist` and would
      # delete the platform build these three read.
      - name: Verify the published package
        run: |
          set -euo pipefail
          npx nx build platform
          # Fails if the built .d.ts surface no longer matches docs/api/platform.api.md.
          # Caught nothing on its own until it was rewritten — it reported PASS across 27
          # changed types because the rolled-up .d.ts has no `export` prefix to match.
          npm run beta:api
          # Runs a real `npm publish --dry-run`, the only check that executes the
          # `prepublishOnly` script. Phase 4 shipped a package that could not be
          # published at all, for want of `compilationMode: partial`.
          npm run beta:publishable
          # Installs the built tarball into a scratch project with NO GitHub Packages credentials,
          # from public npm, and requires it to succeed; then makes the Satori peer required again
          # and requires the install to FAIL. Everything above runs against this monorepo's
          # node_modules, which already holds @hylandsoftware/satori-ui, so none of it can see a
          # customer's install 401 or 404 on a required peer.
          npm run beta:installable
          # Compiles the template against the BUILT declarations instead of the source
          # tree — the resolution a customer actually gets. Found the platform being
          # compiled without `strictNullChecks`, shipping 27 wrong public types.
          npm run beta:fork
          # The only check that crosses a version boundary: installs the package, applies a
          # Layer 0/1/2 customisation, upgrades, and proves the customisation survived. The
          # three above each test a single version, so none of them can see an upgrade that
          # compiles cleanly and silently breaks a customer's JSON manifest.
          npm run beta:upgrade

      - name: Check bundle size (nuxeo-ui)
        shell: bash
        env:
          # 6 MiB of TOTAL shipped JS+CSS — distinct from the Angular *initial* budget
          # in angular.json (4 MB), which measures only the eager entry point.
          #
          # Raised from 5 MiB on 2026-08-24. The 5 MiB figure was set on 2026-04-21,
          # before adf-hx adoption was planned, and was never revisited — while the
          # Angular initial ceiling was deliberately raised twice during the Beta with
          # the reasoning recorded. This one had no owner, so a 0.60% breach kept CI red
          # for 16 consecutive runs without anyone understanding why.
          #
          # What moved it: putting the adf-hx bridge in the root injector makes adf-core
          # eager (+1.15 MB, accepted in Phase 3 — 11 upstream services are
          # `providedIn: 'root'` and providing the ports on a component instead fails
          # one NG0201 at a time). Then the viewer +60 kB and search +10 kB.
          #
          # Headroom at 6 MiB is ~1.0 MB, roughly 14 more components at the recent rate.
          # This DEFERS the real fix rather than making it: adf-core should be lazy. Do
          # not raise this again without attempting that first.
          NUXEO_UI_BUNDLE_SIZE_LIMIT_BYTES: 6291456
        run: |
          set -euo pipefail

          if npx nx show projects --affected --base=$NX_BASE --head=$NX_HEAD --plain | grep -q "^nuxeo-ui$"; then
            rm -rf dist
            npx nx build nuxeo-ui --configuration=production

            # Bundle *contents*, not just its size — and this is the first commit in which
            # it runs here at all. It is the gate that found adf-hx importing a test
            # library from its shipped runtime bundle, putting ng-mocks' implementation and
            # two `eval()` calls into a customer-facing chunk. It needs the production
            # build, which is why it lives in this step rather than with the static gates
            # above, and it must come before the size measurement so a contents failure is
            # not reported as a size pass.
            #
            # Invoked directly rather than through `beta:gate --gates bundle`: the gate
            # runner writes its report under the evidence root on the developer's Desktop,
            # which does not exist on a runner.
            npm run beta:bundle

            # Scoped to dist/nuxeo-ui, NOT `-path '*/nuxeo-ui/*'` under all of dist.
            #
            # That glob also matches `dist/out-tsc/apps/nuxeo-ui/**`, which is the
            # `typecheck` target's ngc output, not the shipped bundle. It only measured
            # the right thing here because this step does `rm -rf dist` first and CI
            # happens to run typecheck before it without leaving output behind. Locally
            # the same command reports 9.8 MB against a 5 MB ceiling — 345 files instead
            # of 63 — so anyone reproducing a CI failure got a number that could not be
            # reconciled with the one in the log.
            bundle_size_bytes=$(
              find dist/nuxeo-ui -type f \( -name '*.js' -o -name '*.css' \) -printf '%s\n' \
                | awk '{ total += $1 } END { print total + 0 }'
            )

            if [ "$bundle_size_bytes" -eq 0 ]; then
              echo "Failed to measure bundle size for nuxeo-ui: no built JS/CSS assets were found under dist."
              exit 1
            fi

            echo "nuxeo-ui bundle size: ${bundle_size_bytes} bytes"
            echo "nuxeo-ui bundle size limit: ${NUXEO_UI_BUNDLE_SIZE_LIMIT_BYTES} bytes"

            if [ "$bundle_size_bytes" -gt "$NUXEO_UI_BUNDLE_SIZE_LIMIT_BYTES" ]; then
              echo "nuxeo-ui bundle size exceeds limit."
              exit 1
            fi
          else
            echo "nuxeo-ui is not affected; skipping bundle size check."
          fi

  test:
    needs: base
    runs-on: ubuntu-latest
    env:
      NX_BASE: ${{ needs.base.outputs.base }}
      NX_HEAD: ${{ needs.base.outputs.head }}
    steps:
      # Must precede the local composite action below. The runner resolves
      # ./.github/actions/setup from the workspace, so the repository has to be on disk
      # before that step can be loaded at all.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          github-packages-token: ${{ secrets.SATORI_GH_READONLY_TOKEN }}
          base: ${{ needs.base.outputs.base }}
          head: ${{ needs.base.outputs.head }}

      # `--parallel=1` is kept deliberately (f7ab1f78a): the Vitest and Karma projects
      # intermittently exited under runner contention with no useful failure output when run
      # concurrently with each other. This job having a runner to itself does not change that —
      # the contention was between the test projects, not between tests and the other steps —
      # so serialising them is still the right call and this is not the place to revisit it.
      # Giving each project its own JOB would be, and is a separate change.
      - name: Test affected projects
        run: |
          npx nx run document-detail:test --output-style=stream
          npx nx run knowledge-discovery:test --output-style=stream
          npx nx run search:test --output-style=stream
          npx nx run browse:test --output-style=stream
          npx nx affected -t test --base=$NX_BASE --head=$NX_HEAD --output-style=stream --parallel=1 --exclude=browse,document-detail,knowledge-discovery,search

  # The critical path of the whole workflow, ~9 minutes of the ~9.5, so this job is what the
  # wall clock is now waiting on. Both steps stay together: the interactions run against the
  # Storybook the first step builds.
  storybook:
    needs: base
    runs-on: ubuntu-latest
    env:
      NX_BASE: ${{ needs.base.outputs.base }}
      NX_HEAD: ${{ needs.base.outputs.head }}
    steps:
      # Must precede the local composite action below. The runner resolves
      # ./.github/actions/setup from the workspace, so the repository has to be on disk
      # before that step can be loaded at all.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          github-packages-token: ${{ secrets.SATORI_GH_READONLY_TOKEN }}
          base: ${{ needs.base.outputs.base }}
          head: ${{ needs.base.outputs.head }}

      # The `nxs-` library's Storybook must build without a GitHub Packages token (NXSAT-308, plan
      # section 9.4). Built here with `@hylandsoftware` and `@alfresco` REMOVED from node_modules,
      # because with them installed an accidental Satori import compiles and the claim is untested.
      # `checkSatoriComponentsDependencies` holds the same rule statically; this is the build that
      # proves it. About a minute, so only when the library is affected, or the interaction runner
      # below, its dialog layout check or the publication gate changed — a script outside every
      # project affects none. A skip says so.
      #
      # Then the publication gate, which storybook-pages.yml runs before publishing this build to
      # GitHub Pages: here, whenever this step builds, it fails the pull request instead.
      # The affected set and the two script diffs, resolved ONCE for this job.
      #
      # The build step and the interactions step each computed these for themselves, so every run
      # paid for two `nx show projects --affected` queries and carried two copies of a condition
      # that differ by exactly one term. Resolving them here also gives the Playwright cache below
      # something to condition on, which it needs: ungated it would restore a ~170 MB browser
      # archive on every run, including the majority where nothing touches satori-components and
      # both steps below are skipped.
      #
      # `nx show projects` is captured into a variable before it is tested, so a failing query
      # fails this step instead of reading as "not affected" — carried over from the originals,
      # along with the exact `grep -qx` match and the unquoted `--base`/`--head` they used.
      - name: Resolve what this job needs to run
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          affected="$(npx nx show projects --affected --base=$NX_BASE --head=$NX_HEAD)"
          runner="$(git diff --name-only "$NX_BASE...$NX_HEAD" -- scripts/storybook-interactions.mjs 'scripts/storybook-dialog-layout*.mjs')"
          gate="$(git diff --name-only "$NX_BASE...$NX_HEAD" -- 'scripts/storybook-publication-gate*.mjs')"

          satori=false
          if grep -qx satori-components <<<"$affected"; then satori=true; fi

          build=false
          if [ "$satori" = true ] || [ -n "$runner" ] || [ -n "$gate" ]; then build=true; fi

          # The publication gate diff deliberately does NOT appear here: a change to the gate
          # needs the build it inspects, not the browser suite. Same asymmetry as before.
          interactions=false
          if [ "$satori" = true ] || [ -n "$runner" ]; then interactions=true; fi

          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "interactions=$interactions" >> "$GITHUB_OUTPUT"

          # Said out loud. A step skipped by `if:` renders as "nothing happened", and this
          # repository treats a check that did not run as its own result rather than as a pass —
          # so the two NOT RUN lines the original steps printed are printed here instead.
          if [ "$build" != true ]; then
            echo "satori-components is not affected and the runner and publication gate are unchanged: Storybook build and publication gate NOT RUN"
          fi
          if [ "$interactions" != true ]; then
            echo "satori-components is not affected and the runner is unchanged: Storybook interactions NOT RUN"
          fi

      - name: Storybook builds without GitHub Packages and carries no Satori (satori-components)
        if: steps.scope.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          hidden="$RUNNER_TEMP/github-packages-scopes"
          mkdir -p "$hidden"
          restore() { for scope in "$hidden"/@*; do if [ -e "$scope" ]; then mv "$scope" node_modules/; fi; done; }
          trap restore EXIT
          # A scope the tree no longer installs is already absent, which is what this build tests.
          for scope in @hylandsoftware @alfresco; do
            if [ -e "node_modules/$scope" ]; then mv "node_modules/$scope" "$hidden"/; fi
          done
          npx nx run satori-components:build-storybook:ci --skip-nx-cache
          node scripts/storybook-publication-gate.mjs dist/storybook/satori-components

      # Read from the one runtime source for the pin (a11y/versions.mjs) so the cache key below
      # cannot drift from the version the next step installs — a cache keyed on a stale version
      # would restore the wrong browser and the install would quietly re-download it anyway.
      - name: Resolve the pinned Playwright version
        id: playwright
        if: steps.scope.outputs.interactions == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node --input-type=module -e "import { PLAYWRIGHT_TEST_VERSION } from './a11y/versions.mjs'; console.log(PLAYWRIGHT_TEST_VERSION)")"
          test -n "$version" || { echo "could not read PLAYWRIGHT_TEST_VERSION"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pinned @playwright/test: $version"

      # Caches the Chromium BUILD ONLY, which is the half that lives under ~/.cache/ms-playwright.
      #
      # Read the step below before assuming this fixes the download problem recorded there: it
      # does not. The cost documented in that comment is `--with-deps`, an apt fetch of a 25.9 MB
      # set of system packages — CJK fonts, NSS, xvfb — that install into system directories this
      # cache does not cover and cannot. A browser-binary hit removes roughly the 170 MB Chromium
      # download and nothing else; the apt half still answers to the Azure Ubuntu mirror's
      # throughput, which was measured at 49-91 kB/s across three runs on 2026-10-23.
      #
      # The fix for the apt half is a container image that ships both
      # (`mcr.microsoft.com/playwright:v<version>-noble`), which is a larger change than this one
      # and is NOT made here. So `timeout-minutes: 25` below stays exactly where it is.
      - name: Cache the pinned Playwright browser
        if: steps.scope.outputs.interactions == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The stories' play functions, run in Chromium against the Storybook just built (Codex audit
      # F08). Storybook runs a play function only when someone opens the story, so one that started
      # failing stayed green everywhere. Fails on a throwing play — watched as its own event, because
      # Storybook reports `storyFinished: success` even then — a render error, an uncaught page error
      # or an untranslated key. axe results from the a11y addon are printed, never judged:
      # docs/accessibility.md gives that verdict to the axe runtime layer. Only the token-free
      # Storybook; the Satori adapter's needs GitHub Packages and is not run. Playwright is installed
      # with --no-save, so the lockfile and `npm ci` are untouched. Every `Dialogs/` story is also
      # checked for MatDialog's layout at 1280 and 320 px (`storybook-dialog-layout.mjs`), after
      # that check's own negative controls have run.
      #
      # The suite is about four and a half minutes — 268.9 s for all 214 stories, measured in run
      # 39914726264 — and it is NOT what spends this step's budget. `playwright install --with-deps`
      # is: the apt fetch of its 25.9 MB set (CJK fonts, NSS, xvfb) from the Azure Ubuntu mirror was
      # recorded at 90.9 kB/s (4m45s), 82.9 kB/s (5m13s) and 49.2 kB/s (8m47s) in three runs on
      # 2026-10-23, so everything before the suite took up to 9m42s and the step would have needed
      # about 14m10s while `timeout-minutes` said 10. All three were killed without one story or
      # layout failure between them — one printing `214 of 214 stories passed` in the same second as
      # the timeout — which reads as a broken suite and is a download that went slowly. They were
      # masked on `integration/**` by the static-gate failure skipping this step; splitting the
      # workflow into independent jobs removes that masking, since a red static gate no longer
      # prevents this job from running and reporting.
      #
      # So 25 minutes, and it is not headroom over the suite: the suite already has its own budget.
      # `storybook-interactions.mjs` defaults to `--budget 600000`, a hard 10-minute cap measured
      # from browser launch after which every remaining story is FAILED rather than skipped, so a
      # suite that slows down goes red on its own terms and this timeout can never be what hides
      # it. 25 = that 10-minute self-cap plus 15 minutes for everything before it, which is 1.5x the
      # slowest pre-suite phase on record. Do not trim it back towards the suite's duration: the
      # install is the unbounded half, it answers to a mirror's throughput rather than to anything
      # in this repository, and `registry-auth.yml` already allows 25 for the same reason. The
      # browser cache above does not change this: it covers the Chromium binary, not the apt set.
      - name: Storybook interactions (satori-components)
        if: steps.scope.outputs.interactions == 'true'
        shell: bash
        timeout-minutes: 25
        env:
          # `.npmrc` reads both; npm refuses to start when a variable it names is unset.
          NODE_AUTH_TOKEN: ${{ secrets.SATORI_GH_READONLY_TOKEN }}
          SATORI_GH_READONLY_TOKEN: ${{ secrets.SATORI_GH_READONLY_TOKEN }}
          PLAYWRIGHT_TEST_VERSION: ${{ steps.playwright.outputs.version }}
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund "@playwright/test@${PLAYWRIGHT_TEST_VERSION}"
          npx playwright install --with-deps chromium
          # The dialog layout check's negative controls first: a check that cannot fail proves nothing.
          node --test scripts/storybook-dialog-layout.selftest.mjs
          node scripts/storybook-interactions.mjs --json "$RUNNER_TEMP/storybook-interactions.json"

      - name: Upload the Storybook interaction results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-interactions
          path: ${{ runner.temp }}/storybook-interactions.json
          if-no-files-found: ignore
