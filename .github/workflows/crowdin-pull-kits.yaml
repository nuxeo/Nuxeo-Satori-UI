# Opens a pull request with the business apps' labels that have been translated and approved.
#
# The kits' half of the download, beside `crowdin-pull.yaml`, which downloads the app's catalogue.
# Separate because a kit is a versioned package: the pull request that brings a kit's file in a
# language must also name the file in the kit's component and raise the kit's version, and a bot
# cannot. The package pipeline refuses the kit until a person has. In the app's pull request, which
# is one for every language, that would hold every app catalogue red with the kits; here it holds
# only the kits. `crowdin-kits.yml` says the rest.
#
# Every rule `crowdin-pull.yaml` follows holds here, and `checkCrowdinConfig` checks it here too:
# approved-only export, no skip option, the commit signed on the action, the bot's token. Each is
# explained in `crowdin-pull.yaml` and not repeated.
#
# OFF until a kit string is approved. `vars.CROWDIN_KIT_LABELS_ENABLED` turns it on, beside the
# sync's own switch. Before any approval, every file it wrote would be English throughout, which the
# app already shows without one, and every one would still need its kit named and versioned.
name: Crowdin Pull, kit labels

on:
  # An hour after the app's pull, so the two pull requests do not race for the runner or the API.
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: crowdin-pull-kits
  cancel-in-progress: false

jobs:
  pull-kit-labels:
    if: vars.CROWDIN_SYNC_ENABLED == 'true' && vars.CROWDIN_KIT_LABELS_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # As in `crowdin-pull.yaml`: a half-configured activation fails loudly rather than delivering
      # less than this job's pull request body promises.
      - name: Check the activation is complete
        env:
          SIGNING_ENABLED: ${{ vars.GPG_BOT_SIGNING_ENABLED }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          missing=()
          [ "$SIGNING_ENABLED" = "true" ] || missing+=("vars.GPG_BOT_SIGNING_ENABLED must be 'true' — this job commits and every bot commit here is signed")
          [ -n "$GPG_PRIVATE_KEY" ] || missing+=("secrets.GPG_PRIVATE_KEY")
          [ -n "$GPG_PASSPHRASE" ] || missing+=("secrets.GPG_PASSPHRASE")
          [ -n "$CROWDIN_PROJECT_ID" ] || missing+=("secrets.CROWDIN_PROJECT_ID")
          [ -n "$CROWDIN_PERSONAL_TOKEN" ] || missing+=("secrets.CROWDIN_PERSONAL_TOKEN")
          [ -n "$BOT_GITHUB_TOKEN" ] || missing+=("secrets.BOT_GITHUB_TOKEN — the default GITHUB_TOKEN pushes a branch without starting a workflow, so the pull request would arrive with no CI, and the package pipeline is what tells its reviewer which kits to name and version")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::CROWDIN_KIT_LABELS_ENABLED is on but the activation is incomplete."
            for item in "${missing[@]}"; do echo "  - $item"; done
            echo "See docs/i18n-localization-plan.md D8 and docs/github-bot-commit-signing.md."
            exit 1
          fi
          echo "Activation complete: signing on, Crowdin credentials and bot token present."

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Download the kits' labels and open a pull request
        uses: crowdin/github-action@8868a33591d21088edfc398968173a3b98d51706 # v2.16.2
        with:
          skip_ref_checkout: true

          config: crowdin-kits.yml
          upload_sources: false
          download_translations: true

          # Only languages with an approved kit string: a language listed here with none writes
          # every kit's file in English, and each such file still needs its kit named and versioned.
          # So **the change that sets `CROWDIN_KIT_LABELS_ENABLED` sets this list too**, to the
          # languages with approvals then. It is French alone until that change, as a placeholder:
          # French is the language of phase 8's demo and the one the app has shipped longest. An
          # empty list is no way to leave it unset — the CLI then downloads every target language.
          # Each id is Crowdin's, so Norwegian is `nb` or `no`, whichever the project targets;
          # either is written `nb.json` (`crowdin-kits.yml`). An unknown id fails the whole pull, so
          # add the language on the project first.
          download_translations_args: '--language=fr'

          create_pull_request: true
          localization_branch_name: crowdin-kit-labels-update
          pull_request_base_branch_name: main
          pull_request_title: 'chore(i18n): new Crowdin translations of kit labels'
          pull_request_body: |
            Opened by the Crowdin Pull workflow for the kits' labels. Contains only
            `business-apps/packages/<kit>/bundle/agentic-ui-config/labels/<language>.json` files.

            **This pull request needs a person before it can merge,** and its checks say where: the
            package pipeline (App definition packages) refuses each kit whose files changed until,
            in this pull request,
            - each new language file is named in the kit's component:
              `npx nx g ./tools/satori-generators:app-registry --package=business-apps/packages/<kit>`;
            - the kit's version is raised, a minor for a new language and a patch for changed texts,
              in `package/package.xml`, `app.json`'s `packageVersion` and the manifest's
              `Bundle-Version`.

            A string not yet approved in Crowdin arrives as its English source, and a key a file
            leaves out shows in English, key by key. **Check the diff for real translations turning
            back into English**: the export replaces the whole file, and no check fails on it. Do
            not merge a pull that does this; get the translation approved in Crowdin first.

            Do not hand-edit a kit's translation to fix something here. Crowdin is the source of
            truth and overwrites it on the next pull; fix it in Crowdin.
          commit_message: 'chore(i18n): update kit labels from Crowdin'

          github_user_name: github-actions[bot]
          github_user_email: github-actions[bot]@users.noreply.github.com

          # On the action, which commits inside its own container: see `crowdin-pull.yaml`.
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg_passphrase: ${{ secrets.GPG_PASSPHRASE }}
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
