name: Dead Code Agent

on:
  schedule:
    - cron: '0 6 * * 1'  # weekly on Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  dead-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          SATORI_GH_READONLY_TOKEN: ${{ secrets.SATORI_GH_READONLY_TOKEN }}

      - name: Run knip (dead code detection)
        id: knip
        run: |
          npx knip --reporter json > /tmp/knip-results.json 2>&1 || true
          ISSUE_COUNT=$(cat /tmp/knip-results.json | jq '[.files[], .exports[]?, .unlisted[]?] | length' 2>/dev/null || echo "0")
          echo "issue_count=${ISSUE_COUNT}" >> $GITHUB_OUTPUT
          cat /tmp/knip-results.json | jq -r '
            "## Dead Code Report — " + (now | strftime("%Y-%m-%d")) + "\n\n",
            if .files | length > 0 then
              "### Unused Files (" + (.files | length | tostring) + ")\n" +
              (.files[] | "- `" + . + "`") + "\n\n"
            else "" end,
            if .exports | length > 0 then
              "### Unused Exports (" + (.exports | length | tostring) + ")\n" +
              (.exports[] | "- `" + .name + "` in `" + .filePath + "`") + "\n\n"
            else "" end
          ' > /tmp/knip-report.md 2>/dev/null || echo "No issues found or knip not configured." > /tmp/knip-report.md

      - name: Open GitHub Issue if issues found
        if: steps.knip.outputs.issue_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)
          REPORT=$(cat /tmp/knip-report.md)

          # Check if an open issue already exists for this week
          EXISTING=$(gh issue list --label "dead-code" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -z "$EXISTING" ]; then
            gh issue create \
              --title "Dead code report — ${DATE}" \
              --body "${REPORT}

---
*Generated automatically by the Dead Code Agent (dead-code.yml).*
*To suppress a false positive, add the file/export to \`.knip.json\` ignore list.*" \
              --label "dead-code,maintenance"
          fi
