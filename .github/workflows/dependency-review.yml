name: Dependency Review

on:
  # PRs into an `integration/<ticket>` branch get the same gate as PRs into `main`.
  pull_request:
    branches:
      - main
      - 'integration/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          # Fail on moderate or higher severity vulnerabilities
          fail-on-severity: moderate
          # Optionally fail on license restrictions (uncomment to enable)
          # deny-licenses: GPL-2.0, LGPL-2.0
