name: E2E nightly

# NXSAT-231. Runs the Playwright suite on Chromium and WebKit against a HOSTED Nuxeo, because a
# GitHub runner has no Nuxeo of its own (no compose file, no packages.nuxeo.com credentials).
# The Angular dev server runs in the job and proxies /nuxeo to the hosted instance, so the specs
# keep seeing the app at the origin root and the code under test is this checkout, not
# whatever happens to be deployed.
#
# Required repository secrets (no defaults anywhere, by design):
#   NUXEO_E2E_TARGET  origin of the hosted Nuxeo, scheme + host only
#   NUXEO_USER        a dedicated test account — the suite creates and trashes documents
#   NUXEO_PASS
#   SATORI_GH_READONLY_TOKEN  already used by ci.yml

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# One run at a time. Each integration and staging branch queues in a group of its own instead: the
# scheduled run dispatches all of them at the same moment (job `integration-branches`), and a group
# keeps only one pending run, so a shared group would cancel all but the last. They are dispatched
# after `main`'s suite has finished, so they do not overlap it, though they run at the same time as
# each other, and as any pull request's smoke run (e2e-smoke.yml). Each spec titles what it makes
# with a random suffix, which keeps their documents apart; the server and the account are shared.
concurrency:
  group: ${{ (startsWith(github.ref, 'refs/heads/integration/') || startsWith(github.ref, 'refs/heads/staging/')) && format('e2e-nightly-{0}', github.ref) || 'e2e-nightly' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          github-packages-token: ${{ secrets.SATORI_GH_READONLY_TOKEN }}
          base: ${{ github.sha }}
          head: ${{ github.sha }}

      # Fail with the reason, not with a Playwright stack trace three steps later.
      - name: Require configuration
        env:
          NUXEO_E2E_TARGET: ${{ secrets.NUXEO_E2E_TARGET }}
          NUXEO_USER: ${{ secrets.NUXEO_USER }}
          NUXEO_PASS: ${{ secrets.NUXEO_PASS }}
        run: |
          for v in NUXEO_E2E_TARGET NUXEO_USER NUXEO_PASS; do
            [ -n "${!v}" ] || { echo "::error::repository secret $v is not set"; exit 1; }
          done

      # Playwright is deliberately not a tracked dependency (CLAUDE.md). Both packages in ONE
      # command: `--no-save` prunes anything earlier installed the same way. Versions are
      # pinned per docs/accessibility.md — never a range, never a dist-tag.
      - name: Install Playwright (not saved)
        run: |
          npm install --no-save @playwright/test@1.63.0 @axe-core/playwright@4.13.0
          npx playwright install --with-deps chromium webkit

      - name: Serve the app against the hosted Nuxeo
        env:
          NUXEO_PROXY_TARGET: ${{ secrets.NUXEO_E2E_TARGET }}
        run: |
          nohup npx ng serve nuxeo-ui -c development,remote --port 4200 > dist-serve.log 2>&1 &
          for _ in $(seq 1 90); do
            curl -fsS -o /dev/null http://localhost:4200/ && exit 0
            sleep 2
          done
          echo "::error::dev server did not come up"; tail -n 50 dist-serve.log; exit 1

      # The preflight refuses a vacuous pass: wrong host, wrong identity, or an empty repository.
      - name: Preflight
        env:
          NUXEO_USER: ${{ secrets.NUXEO_USER }}
          NUXEO_PASS: ${{ secrets.NUXEO_PASS }}
          E2E_ALLOWED_HOSTS: localhost:4200
        run: npx tsx scripts/beta-harness/e2e-preflight.mjs

      # `--trace off`: a trace holds the browser context's options, `httpCredentials` and so
      # NUXEO_PASS among them, in plain text (measured with Playwright 1.63.0 on 28 November 2026),
      # and this public repository's artifacts can be downloaded by anyone signed in. The suite and
      # its projects are unchanged; only the artifact a failure leaves is. `PLAYWRIGHT_NO_COPY_PROMPT`
      # likewise keeps the page's snapshot, which holds a filled field's value, out of a failed
      # test's error-context.md.
      - name: Run the suite (${{ matrix.project }})
        env:
          CI: 'true'
          PLAYWRIGHT_NO_COPY_PROMPT: '1'
          NUXEO_USER: ${{ secrets.NUXEO_USER }}
          NUXEO_PASS: ${{ secrets.NUXEO_PASS }}
        run: npx playwright test -c apps/nuxeo-ui-e2e/playwright.config.ts --project=${{ matrix.project }} --trace off

      # Screenshots and video are retained on failure only (playwright.config.ts); no trace, above.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.project }}
          path: dist/e2e
          if-no-files-found: ignore
          retention-days: 14

      - name: Dev server log
        if: failure()
        run: tail -n 100 dist-serve.log || true

  # A schedule only ever runs the default branch's copy of this workflow, so on its own an
  # integration branch (AGENTS/06-git-workflow.md) would get no nightly run, and its code would
  # reach `main`, in one final pull request, untested end to end. So the scheduled run dispatches
  # this workflow on every `integration/**` branch, and on every `staging/**` branch, which reaches
  # an integration branch the same way, once `main`'s suite has finished, whatever its result. A
  # dispatched run tests that branch's code with that branch's copy of this file, and dispatches
  # nothing itself: this job runs on the schedule only. It lists the branches when it runs, so a new
  # integration or staging branch needs no edit here.
  #
  # Every branch is tried even when one fails, so one branch that cannot be dispatched does not
  # leave the others untested. The dispatch step records the failures and stays green; the step
  # after it fails the job with their names, which the report job puts in the tracking issue.
  integration-branches:
    name: Dispatch on integration and staging branches
    needs: e2e
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      failed: ${{ steps.dispatch.outputs.failed }}
    steps:
      - name: Dispatch this workflow on each integration and staging branch
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Two calls, each its own assignment, so either one failing fails the step under `set -e`.
          integration=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/integration/" --jq '.[].ref | sub("^refs/heads/"; "")')
          staging=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/staging/" --jq '.[].ref | sub("^refs/heads/"; "")')
          branches=$(printf '%s\n%s\n' "$integration" "$staging")
          if [ -z "$branches" ]; then
            echo "No integration or staging branches."
          fi
          failed=""
          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            echo "Dispatching on $branch"
            if ! gh workflow run e2e-nightly.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"; then
              echo "::error::The nightly run could not be dispatched on $branch"
              failed="${failed:+$failed, }$branch"
            fi
          done <<< "$branches"
          # A branch name holds no newline (git refuses control characters), so this stays one line.
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Fail if any branch could not be dispatched
        if: ${{ steps.dispatch.outputs.failed != '' }}
        env:
          FAILED: ${{ steps.dispatch.outputs.failed }}
        run: |
          echo "::error::The nightly run could not be dispatched on: $FAILED"
          exit 1

  # A red nightly nobody sees is worth about as much as no job. This opens one tracking issue
  # and comments on it for each further failure, rather than a new issue every night. An
  # integration or staging branch gets an issue of its own, so that its failures do not read as
  # `main`'s. A
  # failed dispatch is reported too, because it leaves those branches with no run at all.
  report:
    name: Report failure
    needs: [e2e, integration-branches]
    if: ${{ always() && (needs.e2e.result == 'failure' || needs.integration-branches.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          E2E_RESULT: ${{ needs.e2e.result }}
          DISPATCH_RESULT: ${{ needs.integration-branches.result }}
          FAILED_BRANCHES: ${{ needs.integration-branches.outputs.failed }}
        run: |
          set -euo pipefail
          title="E2E nightly is failing"
          case "$GITHUB_REF" in
            refs/heads/integration/* | refs/heads/staging/*) title="$title on $GITHUB_REF_NAME" ;;
          esac
          body=""
          if [ "$E2E_RESULT" = failure ]; then
            body="The nightly Playwright run (Chromium + WebKit) on $GITHUB_REF_NAME failed."
          fi
          if [ "$DISPATCH_RESULT" = failure ]; then
            if [ -n "$FAILED_BRANCHES" ]; then
              case "$FAILED_BRANCHES" in *,*) untested="they were" ;; *) untested="it was" ;; esac
              body="${body:+$body }The nightly run could not be dispatched on $FAILED_BRANCHES, so $untested not tested."
            else
              # No branch is named when the job failed before trying any, as when listing them fails.
              body="${body:+$body }The dispatch job failed before it could try the integration branches, so none of them was tested."
            fi
          fi
          body="$body $RUN_URL"
          # The search matches the title as a phrase, so `main`'s title also finds an integration
          # branch's issue. Only an exact title counts.
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title \
            | jq -r --arg t "$title" 'map(select(.title == $t)) | .[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
