name: E2E smoke

# The current app's end-to-end flows on every pull request into `main`, `integration/**` and
# `staging/**`, so that business apps work cannot change the current app unnoticed: phase 0 of
# docs/business-apps/development-plan.md. The flows are the suite's `@smoke` tests, which
# apps/nuxeo-ui-e2e/src/smoke.ts lists with why each is there, on Chromium. e2e-nightly.yml still
# runs the whole suite on Chromium and WebKit every night.
#
# As the nightly does: Playwright against the hosted Nuxeo, with the Angular dev server in the job
# proxying /nuxeo to it, so the code under test is the pull request's. The same three secrets,
# NUXEO_E2E_TARGET, NUXEO_USER and NUXEO_PASS, and SATORI_GH_READONLY_TOKEN for `npm ci`.
#
# **Without the secrets,** as for a fork's pull request or Dependabot's, which GitHub gives none of
# them, `smoke` is skipped and `not-run` says so in a notice and the run's summary. Skipped is the
# neutral result Actions has: the check shows grey, never a green tick for tests that did not run,
# and an external contribution is not failed for a secret it cannot have. On this repository's own
# branches the secrets are required, and their absence fails the job.
#
# **What makes it a required check** is a branch protection rule or a ruleset on the target
# branches naming `E2E smoke (chromium)`: an administrator's setting, not this file's
# (docs/business-apps/development-plan.md, phase 0). A required check that is skipped counts as
# passed there, which is what lets a fork's pull request merge; a maintainer who wants it run pushes
# the branch to this repository.
#
# **No write permission and no `pull_request_target`.** The pull request's code runs in `smoke`, so
# it gets `contents: read` and `packages: read`, and the checkout keeps no token in .git/config.
# Controlled by scripts/beta-harness/e2e-smoke.selftest.mjs, with the shapes above: a change to this
# file that drops one of them is refused there.

on:
  pull_request:
    branches: [main, 'integration/**', 'staging/**']

# A new push to a pull request supersedes its run in progress, which is cancelled. The sweep step
# still runs on a cancelled job, `if: always()` being true on cancellation.
concurrency:
  group: e2e-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  not-run:
    name: E2E smoke not run (no secrets)
    if: github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Say that the smoke run did not run, and why
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ "$ACTOR" = 'dependabot[bot]' ]; then
            why="it is Dependabot's, and GitHub gives Dependabot's runs only Dependabot's secrets"
          else
            why="it comes from $HEAD_REPO, a fork, and GitHub gives a fork's pull request no secret"
          fi
          message="The end-to-end smoke flows did not run on this pull request: $why. It is not a pass. To run them, push the branch to $GITHUB_REPOSITORY and open the pull request from there."
          echo "::notice title=E2E smoke not run::$message"
          echo "**E2E smoke not run.** $message" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: E2E smoke (chromium)
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One smoke run at a time against the hosted Nuxeo, across every pull request, so two never
    # write over each other. GitHub keeps one run waiting per group: a third pull request's run
    # cancels the waiting one, which then shows as cancelled, never as passed, until re-run. The
    # nightly runs in groups of its own at 03:00 UTC; the run prefix below keeps a smoke run's
    # documents apart from them too.
    concurrency:
      group: e2e-hosted-nuxeo-smoke
      cancel-in-progress: false
    env:
      # Every document a spec makes is titled with this, and the sweep trashes what is left under it.
      E2E_RUN_PREFIX: e2e-pr${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}-
      E2E_ALLOWED_HOSTS: localhost:4200
      E2E_BROWSERS: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The pull request's code runs in this job; the token is not kept where it could read it.
          persist-credentials: false

      # Fail with the reason, not with a Playwright stack trace three steps later. On this
      # repository's own branches the secrets are there, so their absence is a misconfiguration.
      - name: Require configuration
        env:
          NUXEO_E2E_TARGET: ${{ secrets.NUXEO_E2E_TARGET }}
          NUXEO_USER: ${{ secrets.NUXEO_USER }}
          NUXEO_PASS: ${{ secrets.NUXEO_PASS }}
          SATORI_GH_READONLY_TOKEN: ${{ secrets.SATORI_GH_READONLY_TOKEN }}
        run: |
          for v in NUXEO_E2E_TARGET NUXEO_USER NUXEO_PASS SATORI_GH_READONLY_TOKEN; do
            [ -n "${!v}" ] || { echo "::error::repository secret $v is not set"; exit 1; }
          done

      - uses: ./.github/actions/setup
        with:
          github-packages-token: ${{ secrets.SATORI_GH_READONLY_TOKEN }}
          base: ${{ github.sha }}
          head: ${{ github.sha }}

      # Playwright is deliberately not a tracked dependency (CLAUDE.md), pinned as the nightly pins
      # it. Both packages in one command: `--no-save` prunes anything installed the same way before.
      - name: Install Playwright (not saved)
        run: |
          npm install --no-save @playwright/test@1.63.0 @axe-core/playwright@4.13.0
          npx playwright install --with-deps chromium

      - name: Serve the app against the hosted Nuxeo
        id: serve
        env:
          NUXEO_PROXY_TARGET: ${{ secrets.NUXEO_E2E_TARGET }}
        run: |
          nohup npx ng serve nuxeo-ui -c development,remote --port 4200 > dist-serve.log 2>&1 &
          for _ in $(seq 1 90); do
            curl -fsS -o /dev/null http://localhost:4200/ && exit 0
            sleep 2
          done
          echo "::error::dev server did not come up"; tail -n 50 dist-serve.log; exit 1

      # The preflight refuses a vacuous pass: wrong host, wrong identity, or an empty repository.
      - name: Preflight
        env:
          NUXEO_USER: ${{ secrets.NUXEO_USER }}
          NUXEO_PASS: ${{ secrets.NUXEO_PASS }}
        run: npx tsx scripts/beta-harness/e2e-preflight.mjs

      - name: Run the smoke flows
        env:
          CI: 'true'
          NUXEO_USER: ${{ secrets.NUXEO_USER }}
          NUXEO_PASS: ${{ secrets.NUXEO_PASS }}
        run: npx playwright test -c apps/nuxeo-ui-e2e/playwright.config.ts --project=chromium --grep @smoke

      # Playwright's exit 0 says nothing selected failed, not that anything was selected or ran.
      - name: Hold the report to the smoke subset, every test passed
        run: node scripts/beta-harness/e2e-smoke-verdict.mjs dist/e2e/results.json --project chromium

      # Whatever happened above, cancellation included, once the app was served.
      - name: Trash what the run left
        if: always() && steps.serve.outcome == 'success'
        env:
          NUXEO_USER: ${{ secrets.NUXEO_USER }}
          NUXEO_PASS: ${{ secrets.NUXEO_PASS }}
        run: npx tsx scripts/beta-harness/e2e-sweep.mjs

      # Traces, screenshots and video are retained on failure only (playwright.config.ts).
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-chromium
          path: dist/e2e
          if-no-files-found: ignore
          retention-days: 14

      - name: Dev server log
        if: failure()
        run: tail -n 100 dist-serve.log || true
