# TEMPORARY (NXSAT-231). Answers one question: can a GitHub-hosted runner reach the hosted
# Satori UI Nuxeo? Delete this file once answered. It uses no secrets and sends no credentials.
name: NXSAT-231 reachability

on:
  push:
    branches: ['fix/**']
    paths: ['.github/workflows/nxsat-231-reachability.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reach:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner egress IP
        run: curl -sS -m 10 https://api.ipify.org; echo

      - name: Reach Nuxeo (unauthenticated)
        env:
          HOST: https://satori-ui.beta.nuxeocloud.com
        run: |
          set -u
          root=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$HOST/nuxeo/") || { echo "UNREACHABLE: $HOST"; exit 1; }
          me=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$HOST/nuxeo/api/v1/me") || { echo "UNREACHABLE: api"; exit 1; }
          echo "GET /nuxeo/            -> $root (expect 302)"
          echo "GET /nuxeo/api/v1/me   -> $me   (expect 401 without credentials)"
          # 401 proves Nuxeo itself answered. A 403 or 5xx here is a WAF or allowlist in front.
          [ "$me" = "401" ] || { echo "UNEXPECTED: Nuxeo did not answer 401"; exit 1; }
