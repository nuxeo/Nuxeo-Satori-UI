name: Release Agent

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      release_notes:
        description: 'Additional release notes (optional)'
        required: false
        type: string

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # NOTE: GITHUB_TOKEN authenticates as github-actions[bot].
          # If branch protection is re-enabled and github-actions[bot]
          # is not in the bypass list, git push will fail on line 67.
          # Options: (1) add github-actions[bot] to bypass list,
          # (2) use BOT_GITHUB_TOKEN with bypass permissions, or
          # (3) create a PR instead of direct push.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          SATORI_GH_READONLY_TOKEN: ${{ secrets.SATORI_GH_READONLY_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        run: |
          NEW_VERSION=$(npm version ${{ inputs.version_bump }} --no-git-tag-version)
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Bumped to ${NEW_VERSION}"

      - name: Generate changelog for this release
        run: |
          npx --yes conventional-changelog-cli \
            -p angular \
            -i CHANGELOG.md \
            -s \
            || echo "Changelog generation skipped"

      - name: Commit version bump and changelog
        run: |
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): ${{ steps.version.outputs.new_version }}"
          git tag ${{ steps.version.outputs.new_version }}
          git push && git push --tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.new_version }}
          NOTES="${{ inputs.release_notes }}"

          gh release create "${VERSION}" \
            --title "Release ${VERSION}" \
            --generate-notes \
            ${NOTES:+--notes "$NOTES"} \
            --latest

      - name: Trigger Marketplace build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-marketplace.yml \
            --ref main \
            -f publishToPreprod=true \
            || echo "Marketplace build trigger skipped (workflow may not exist)"
