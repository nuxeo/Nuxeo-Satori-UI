name: AGENTS.md Staleness Agent

on:
  schedule:
    - cron: '0 7 * * 1' # weekly on Monday at 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  staleness-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The detection and the issue body were a bash loop whose generated text was interpolated
      # back into a shell body with `${{ steps.check.outputs.missing }}`. The list items carry
      # backticks, so bash read them as command substitution and tried to execute
      # `content-model.service.ts`, exiting 127. Seven consecutive weekly failures from
      # 14 September, and not one issue filed — and invisible because the issue step runs only
      # when there is drift to report, so the job was green exactly when it had nothing to say.
      #
      # No generated text reaches a shell body now: the script writes the body to a file under
      # $RUNNER_TEMP and `gh issue create --body-file` reads it. Quoting the value would have
      # fixed this instance and left the class. Needs no dependency install — it reads the
      # services directory and the document with `node:fs` only.
      - name: Check for service files missing from AGENTS/01-services.md
        id: check
        run: node scripts/agents-staleness-report.mjs --out "$RUNNER_TEMP/issue-body.md"

      - name: Check for AGENTS/ files referenced but missing
        run: |
          for i in $(seq -w 0 10); do
            if ! ls AGENTS/${i}-*.md 1>/dev/null 2>&1; then
              echo "WARNING: AGENTS/${i}-*.md is missing"
            fi
          done

      - name: Open GitHub Issue if drift detected
        if: steps.check.outputs.drift_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # The `agents-stale` label does not exist on this repository and this workflow never
          # created it, so the shell-injection fix alone would have moved the failure rather than
          # removed it: the first run with drift to report would have got as far as `gh issue
          # create` and stopped there. Raised in review on PR #544, and the label list confirms it.
          #
          # `--force` makes this idempotent, so it is safe on every run and needs no "does it
          # exist" branch.
          #
          # Only `agents-stale` is created: it is this workflow's own label. `documentation` is a
          # shared repository label that already exists, and `gh label create --force` with no
          # `--color` picks a colour AT RANDOM — so forcing it would silently recolour a label
          # other people use. Its absence is checked instead, and reported.
          gh label create agents-stale --force \
            --color BFD4F2 \
            --description "AGENTS/ documentation has drifted from the code"
          if ! gh label list --limit 200 --json name --jq '.[].name' | grep -qx documentation; then
            echo "The 'documentation' label is gone; filing without it rather than failing."
            LABELS="agents-stale"
          else
            LABELS="agents-stale,documentation"
          fi

          EXISTING=$(gh issue list --label "agents-stale" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            echo "Issue #${EXISTING} is already open for this; not filing a second one."
            exit 0
          fi
          gh issue create \
            --title "AGENTS/ is out of date — $(date +%Y-%m-%d)" \
            --body-file "$RUNNER_TEMP/issue-body.md" \
            --label "$LABELS"

      - name: Log no drift
        if: steps.check.outputs.drift_detected == 'false'
        run: echo "AGENTS/01-services.md is up to date."
