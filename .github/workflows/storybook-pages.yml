name: Storybook on GitHub Pages

# Publishes the Material Storybook of `satori-components` to https://nuxeo.github.io/agentic-ui-poc/.
#
# ONLY that build. `satori-components-satori`'s Storybook bundles compiled `@hylandsoftware/*` modules,
# tokens and fonts, and `satori-components:build-storybook:satori` (this library under Satori's theme)
# its tokens and fonts: we may consume them but not redistribute them. This repository is public, so
# neither build may be published, nor uploaded as a workflow artifact by any workflow here.
# `scripts/storybook-publication-gate.mjs` refuses both before this workflow uploads.
#
# A workflow of its own rather than a job in ci.yml: that one runs on pull requests and every feature
# branch, and its `cancel-in-progress` concurrency would cancel a deployment half-way through.

on:
  push:
    # TODO(NXSAT-649): move to `main` once integration/nxsat-308 merges into it. Storybook exists only
    # on the integration branch until then.
    branches: ['integration/nxsat-308']
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A push during a deployment waits for it rather than cancelling it; a
# later push replaces a waiting one, so the newest commit is the one that ends up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Explicit, so a wider workflow-level grant never reaches the job that holds the registry token
    # and runs install scripts.
    permissions:
      contents: read
    env:
      # The gate and the upload read the same directory, so what is checked is what is published.
      STORYBOOK_DIR: dist/storybook/satori-components
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache in a job whose output is published.
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: '@hylandsoftware'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.SATORI_GH_READONLY_TOKEN }}
          SATORI_GH_READONLY_TOKEN: ${{ secrets.SATORI_GH_READONLY_TOKEN }}

      # Built as ci.yml builds it, with `@hylandsoftware` and `@alfresco` removed from node_modules,
      # so a Satori import fails the build instead of compiling into the published site. Nothing
      # later in this job needs them, so they are not put back.
      - name: Build the Material Storybook without GitHub Packages
        shell: bash
        run: |
          set -euo pipefail
          hidden="$RUNNER_TEMP/github-packages-scopes"
          mkdir -p "$hidden"
          for scope in @hylandsoftware @alfresco; do
            if [ -e "node_modules/$scope" ]; then mv "node_modules/$scope" "$hidden"/; fi
          done
          npx nx run satori-components:build-storybook:ci --skip-nx-cache

      - name: Publication gate
        run: node scripts/storybook-publication-gate.mjs "$STORYBOOK_DIR"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.STORYBOOK_DIR }}

  deploy:
    needs: build
    # A dispatch from any other branch builds and gates without publishing.
    if: github.ref == 'refs/heads/integration/nxsat-308'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
