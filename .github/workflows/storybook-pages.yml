name: Storybook on GitHub Pages

# Publishes two Storybooks of `satori-components` to https://nuxeo.github.io/agentic-ui-poc/: the
# Material build at the root, and the same library under Satori's theme at `/satori/`. The root is
# unchanged, so every existing link to the site still lands where it always did.
#
# The Satori build carries compiled `@hylandsoftware/*` modules, `--sat-*` tokens and Satori's
# fonts. This repository is public, so publishing it is redistribution — which the Satori package
# owners approved, relayed 2026-10-28. Record the approver or the ticket here: three places in this
# repository asserted the opposite before this change, and whoever next reads a narrowed gate needs
# to know whose decision overrode them.
#
# `scripts/storybook-publication-gate.mjs` still runs, on the Material build alone, so the root
# stays provably Satori-free. `/satori` is deliberately ungated — it carries Satori on purpose, so
# gating it would mean weakening the gate until it passed, and a gate that passes everything is
# worth nothing. Narrow and meaningful beats broad and hollow.
#
# Still NOT published: `satori-components-satori`'s own Storybook, the components that exist only
# under Satori. Nobody asked for it, and the approval above was for the themed build.
#
# A workflow of its own rather than a job in ci.yml: that one runs on pull requests and every feature
# branch, and its `cancel-in-progress` concurrency would cancel a deployment half-way through.

on:
  push:
    # `main`, which is also Pages' own source. This and the deploy job's `if:` below name the
    # branch twice and have to be changed together: the `if:` gates the deployment, so a stale
    # one freezes the site silently — the build and the publication gate still pass, and
    # nothing publishes, not even a `workflow_dispatch`. Other branches need no trigger here:
    # ci.yml's `storybook` job runs this same token-free build and the same publication gate,
    # so a change that would block the deployment fails its pull request first.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A push during a deployment waits for it rather than cancelling it; a
# later push replaces a waiting one, so the newest commit is the one that ends up published. Keyed
# by ref, because a group holds one waiting run: a dispatch from another branch, which never
# deploys, would otherwise replace a waiting deployment and leave the site on an older commit.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Explicit, so a wider workflow-level grant never reaches the job that holds the registry token
    # and runs install scripts.
    permissions:
      contents: read
    env:
      # The gate reads MATERIAL_DIR and the upload reads the assembled SITE_DIR, so what is checked
      # is no longer all of what is published: `/satori` is published ungated, on purpose.
      MATERIAL_DIR: dist/storybook/satori-components
      SATORI_DIR: dist/storybook/satori-components-satori-theme
      SITE_DIR: _site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache in a job whose output is published.
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: '@hylandsoftware'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.SATORI_GH_READONLY_TOKEN }}
          SATORI_GH_READONLY_TOKEN: ${{ secrets.SATORI_GH_READONLY_TOKEN }}

      # Satori FIRST, while GitHub Packages is still installed. `build-storybook` depends on
      # `compodoc`, which Nx runs once before either build.
      #
      # This is also the job's first `nx` invocation — `npm ci` runs only `husky` — so it is what
      # computes the project graph, with `@hylandsoftware` present. The step below has to compute
      # its own rather than inherit this one; its `env:` block says why.
      - name: Build the Satori-themed Storybook
        run: npx nx run satori-components:build-storybook:satori --skip-nx-cache

      # Then as ci.yml builds it, with `@hylandsoftware` and `@alfresco` removed from node_modules,
      # so a Satori import fails this build instead of compiling into the root of the site. Nothing
      # later in this job needs them, so they are not put back.
      #
      # The order is what keeps the root honest at COMPILE level. Built with those packages still
      # present, a stray Satori import would compile into the Material Storybook and the gate below
      # would be the only thing between it and the root; this way it cannot compile at all.
      #
      # The order alone was not enough at GRAPH level, and the `env:` block is what fixes that.
      - name: Build the Material Storybook without GitHub Packages
        shell: bash
        env:
          # A project-graph cache of this step's own, so the graph is computed AFTER the two scopes
          # are moved out of `node_modules`. Without it the removal proves nothing at graph level:
          # the step still runs, but nothing re-reads the configuration the removal was meant to
          # break, so a root config that cannot load without `@hylandsoftware` passes here.
          #
          # Nx loads the root `eslint.config.mjs` to infer lint targets while it computes the
          # project graph, and that happens for every `nx run`. The Satori build above leaves a
          # complete graph behind, computed while `@hylandsoftware` was installed, and this step
          # would otherwise resolve the same cache and reuse it: `@nx/eslint/plugin` never re-reads
          # the root config, so a module that config requires out of a removed scope is never
          # resolved a second time. The graph cache is keyed on the hashes of TRACKED files, and
          # moving a package out of `node_modules` changes none of them. `--skip-nx-cache` below
          # does not help — it skips the TASK cache, not the project graph.
          #
          # Not hypothetical: it is this workflow's own history. `eslint.config.mjs` began requiring
          # `@hylandsoftware/satori-lint/eslint` unguarded on 2026-10-25 (`e901c8c6d`), and
          # publishing failed on both pushes to `main` of 2026-10-28 with `Failed to process project
          # graph. ... Cannot find module '@hylandsoftware/satori-lint/eslint'` (runs 40672226172,
          # 40672756635). It went green again on 2026-10-29 (runs 40793742248, 40793899388) with
          # that require still unguarded, because the Satori build had just been moved ahead of this
          # one and left a warm graph. Green by blindness, not by repair — #500 guarded the require
          # afterwards, and #500 is the only reason `main` is honestly green rather than quietly so.
          #
          # Measured 2026-10-29 by running these two steps verbatim, with a canary package required
          # unguarded from the root config standing in for the removed scope: warm graph with the
          # canary deleted exits 0 after a full build, a graph directory of this step's own exits 1
          # in two seconds with `Failed to process project graph. ... Cannot find module`, and with
          # that require guarded the same cold graph exits 0 again and the build runs. A canary
          # rather than `@hylandsoftware` itself because a worktree under this repository resolves
          # the scope from the PARENT checkout's `node_modules` — measured, it resolves to
          # `../../../node_modules/@hylandsoftware/satori-lint/eslint/index.cjs` — so moving the
          # worktree's own copy out proves nothing locally. A runner has no parent checkout, which
          # is why the real thing failed there and cannot be made to fail in a worktree. Delete this
          # line and the blindness returns — that is the control.
          #
          # #503 adds the same block, for the same reason, to ci.yml's `storybook` job, which runs
          # this same token-free build.
          NX_PROJECT_GRAPH_CACHE_DIRECTORY: ${{ runner.temp }}/nx-graph-without-github-packages
        run: |
          set -euo pipefail
          hidden="$RUNNER_TEMP/github-packages-scopes"
          mkdir -p "$hidden"
          for scope in @hylandsoftware @alfresco; do
            if [ -e "node_modules/$scope" ]; then mv "node_modules/$scope" "$hidden"/; fi
          done
          npx nx run satori-components:build-storybook:ci --skip-nx-cache

      # On the Material build alone, and while it is still a tree of its own, so the gate sees
      # exactly the shape it was written for rather than an assembled site with `/satori` in it.
      - name: Publication gate, on the Material build
        run: node scripts/storybook-publication-gate.mjs "$MATERIAL_DIR"

      # Refuses a missing or empty build, so a renamed outputDir cannot publish a blank site, and
      # writes nothing at all unless both builds pass. Controls: `storybook-assemble-selftest`.
      - name: Assemble the site
        run: |
          node scripts/storybook-assemble-site.mjs \
            --material "$MATERIAL_DIR" --satori "$SATORI_DIR" --out "$SITE_DIR"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    needs: build
    # A dispatch from any other branch builds and gates without publishing. Keep this ref and
    # the push trigger above the same branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
