<!--
  Sliced from libs/features/document-detail/.../document-detail.html (detail-header through
  moreMenu). document-detail-more-actions-focus-ring.spec.ts asserts this structure matches prod.
-->
<div class="detail-header">
  <button mat-icon-button class="detail-header-go-back-btn" type="button" aria-label="Go back">
    <mat-icon aria-hidden="true" class="detail-header-go-back-icon"></mat-icon>
  </button>
  <div class="header-info">
    <div class="header-title" role="heading" aria-level="1">Title</div>
  </div>
  <div class="header-actions">
    <button mat-icon-button type="button" [matMenuTriggerFor]="moreMenu">
      <span class="cdk-visually-hidden" cdkAriaLive="off">More actions</span>
      <mat-icon aria-hidden="true">more_vert</mat-icon>
    </button>
  </div>
  <mat-menu #moreMenu="matMenu"></mat-menu>
</div>
