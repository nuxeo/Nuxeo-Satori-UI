<!--
  Mirrors document-detail.html from detail-header to its toolbar: the page renders its header
  actions, More actions included, through nxs-document-toolbar.header-actions.
  document-detail-more-actions-focus-ring.spec.ts asserts this structure matches prod.
-->
<div class="detail-header more-actions-focus-ring-host">
  <button mat-icon-button class="detail-header-go-back-btn" type="button" aria-label="Go back">
    <mat-icon aria-hidden="true" class="detail-header-go-back-icon"></mat-icon>
  </button>
  <div class="header-info">
    <div class="header-title" role="heading" aria-level="1">Title</div>
  </div>
  <nxs-document-toolbar
    class="header-actions"
    [actions]="actions"
    [moreLabel]="'document-detail.document-detail.more-actions' | translate"
  />
</div>
