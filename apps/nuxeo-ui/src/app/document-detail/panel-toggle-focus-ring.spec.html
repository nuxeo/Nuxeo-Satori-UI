<!--
  Fixture for panel-toggle-focus-ring.spec.ts. Mirrors document-detail.html: `.tabs-header-row`
  with `nxs-tabs.detail-tabs` (the Material tab header) and the overlay `.panel-toggle-btn`.
-->
<div class="tabs-header-row panel-toggle-focus-ring-host">
  <nxs-tabs class="detail-tabs" [tabs]="tabs">
    <ng-template nxsTabBody>Tab body</ng-template>
  </nxs-tabs>
  <button
    type="button"
    mat-icon-button
    class="panel-toggle-btn"
    [matTooltip]="detailsPanelToggleLabelKey() | translate"
    [attr.aria-label]="detailsPanelToggleLabelKey() | translate"
  >
    <mat-icon aria-hidden="true">{{ propertiesPanelOpen() ? 'info' : 'info_outline' }}</mat-icon>
  </button>
</div>
