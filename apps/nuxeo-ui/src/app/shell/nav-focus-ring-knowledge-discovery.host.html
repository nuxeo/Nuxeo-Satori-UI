<!--
  IBM issue 548995131 flags the Knowledge Discovery sidebar link. On /#/dashboard the
  Dashboard item is current and sits directly under Knowledge Discovery with no gap,
  reproducing the same inset-ring adjacency NXENG-761 fixed for other nav entries.
-->
<sat-platform-nav>
  <sat-platform-nav-menu>
    <a sat-platform-nav-menu-item data-nav-id="app.navbar.knowledgeDiscovery">{{
      'shell.test.knowledge-discovery-nav-item' | translate
    }}</a>
    <a sat-platform-nav-menu-item [active]="true" data-nav-id="app.navbar.dashboard">{{
      'shell.test.dashboard-nav-item' | translate
    }}</a>
  </sat-platform-nav-menu>
</sat-platform-nav>
