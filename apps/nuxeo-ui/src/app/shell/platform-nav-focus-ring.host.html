<!--
  Two items, one of them active: the failing adjacency is between the focus ring and the
  active-item highlight, whether that highlight belongs to the focused item itself or to the
  item touching it — nav items have no gap between them.
-->
<sat-platform-nav>
  <sat-platform-nav-menu>
    <a sat-platform-nav-menu-item data-nav-id="idle">Browse</a>
    <a sat-platform-nav-menu-item data-nav-id="active" [active]="true">{{
      'shell.test.platform-nav-item' | translate
    }}</a>
  </sat-platform-nav-menu>
</sat-platform-nav>
