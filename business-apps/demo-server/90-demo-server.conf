## The demo server's search and audit, on the compose project's own OpenSearch (compose.yml's
## `opensearch` service, reached by its name on the project's network). scripts/demo-server.mjs
## copies this file into the Nuxeo container's /etc/nuxeo/conf.d/ before its first start, which is
## when the image merges conf.d into nuxeo.conf. The keys are the ones the fix-bug skill's dedicated
## containers set (.cursor/skills/fix-bug/scripts/new-ticket-workspace.sh), read there from a running
## container's effective nuxeo.conf. No secret is in this file: the security plugin is off, and
## OpenSearch is published on no port.
nuxeo.opensearch2.client.server=http://opensearch:9200
nuxeo.search.client.default.opensearch2.settings.numberOfReplicas=0
nuxeo.search.client.default.opensearch2.settings.numberOfShards=1
nuxeo.audit.backend.default.opensearch2.settings.numberOfReplicas=0
nuxeo.audit.backend.default.opensearch2.settings.numberOfShards=1
