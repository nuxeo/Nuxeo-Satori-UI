<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Moved — Nuxeo Satori UI</title>
    <!--
      The stub for https://nuxeo.github.io/agentic-ui-poc/.

      GitHub redirects a renamed repository's *repository* URL — github.com/nuxeo/agentic-ui-poc
      answers 301 to github.com/nuxeo/Nuxeo-Satori-UI — but it does not redirect that
      repository's *Pages* site. A Pages URL is derived from the repository name, so the old
      path 404s with no redirect and nothing in the renamed repository can serve it. Every link
      anyone had saved to the old published site, including any a reviewer followed, is dead.

      Publishing this requires a repository named exactly `agentic-ui-poc` in the `nuxeo`
      organisation, with Pages enabled on it. See README.md beside this file: that step is an
      organisation-admin action, and doing it breaks the repository-URL redirect above, which is
      why the trade-off is written down rather than assumed.

      A meta refresh and not a `<script>` redirect: Pages serves static files only, has no
      server-side redirect, and a meta refresh works with JavaScript disabled. The visible link
      is for anyone whose browser or extension suppresses the refresh.
    -->
    <meta http-equiv="refresh" content="0; url=https://nuxeo.github.io/Nuxeo-Satori-UI/" />
    <link rel="canonical" href="https://nuxeo.github.io/Nuxeo-Satori-UI/" />
    <meta name="robots" content="noindex" />
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        margin: 4rem auto;
        max-width: 38rem;
        padding: 0 1rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <h1>This site has moved</h1>
    <p>
      The repository was renamed from <code>agentic-ui-poc</code> to <code>Nuxeo-Satori-UI</code> on
      30 October 2026, and its published site moved with it.
    </p>
    <p>
      <a href="https://nuxeo.github.io/Nuxeo-Satori-UI/"
        >https://nuxeo.github.io/Nuxeo-Satori-UI/</a
      >
    </p>
    <p>
      The source is at
      <a href="https://github.com/nuxeo/Nuxeo-Satori-UI">github.com/nuxeo/Nuxeo-Satori-UI</a>.
    </p>
  </body>
</html>
