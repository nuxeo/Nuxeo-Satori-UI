name: Satori Storybook on private Pages

# Builds the two Satori Storybooks from the PUBLIC `nuxeo/agentic-ui-poc` and deploys them to this
# repository's access-controlled Pages site.
#
# This repository holds no product source. It is a publisher: it checks out the public repository
# at a ref, builds there, and deploys here. The direction matters — nothing Satori-shaped is ever
# produced inside the public repository, so its `scripts/storybook-publication-gate.mjs` stays
# exactly as it is and keeps refusing these builds on the public site. The inverse never works:
# building in the public repository and pushing the result here would put licensed bytes through a
# public repository's artifact storage, which is public.
#
# The whole arrangement rests on one fact — that this repository and its Pages site are private.
# `scripts/assert-private.mjs` asserts it against the GitHub API in both jobs and fails closed, so
# the day somebody flips this repository to public the deployment stops instead of redistributing.

# Manual only, by choice. There is no `push` trigger and no `schedule`: this repository holds no
# source, so a push here would mean nothing, and a site carrying licensed assets should go out when
# somebody decides to publish it, not on a timer nobody is watching. Every deployment is therefore
# attributable to a person and a ref.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Ref of nuxeo/agentic-ui-poc to build
        required: false
        default: main

permissions:
  contents: read

# One deployment at a time. A run during a deployment waits rather than cancelling it; a later run
# replaces a waiting one, so the newest build is the one that ends up published.
concurrency:
  group: satori-pages
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: nuxeo/agentic-ui-poc

jobs:
  build:
    runs-on: ubuntu-latest
    # Explicit and narrow: this job holds the GitHub Packages token and runs install scripts, so it
    # gets no `pages: write`. `pages: read` is only so the guard can read the Pages visibility.
    permissions:
      contents: read
      pages: read
    steps:
      # This repository: the workflow's own scripts and the landing page.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The product source, public, so no token. Pinned to the dispatched ref; the fallback covers
      # a dispatch whose optional input was cleared rather than left at its default.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ inputs.ref || 'main' }}
          path: source
          persist-credentials: false

      - name: Record what was checked out
        id: source
        working-directory: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: source/.nvmrc
          # No dependency cache in a job whose output is published.
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: '@hylandsoftware'

      # Both variables on purpose: the source checkout's own `.npmrc` reads
      # SATORI_GH_READONLY_TOKEN, and the config setup-node writes reads NODE_AUTH_TOKEN.
      - name: Install dependencies
        working-directory: source
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.SATORI_GH_READONLY_TOKEN }}
          SATORI_GH_READONLY_TOKEN: ${{ secrets.SATORI_GH_READONLY_TOKEN }}

      # Satori FIRST, while GitHub Packages is still in node_modules. `satori-components:
      # build-storybook` depends on `compodoc`, which Nx runs before either build on its own.
      - name: Build the Satori-themed Storybook
        working-directory: source
        run: npx nx run satori-components:build-storybook:satori --skip-nx-cache

      # Then take GitHub Packages away again, so the Material build below cannot reach Satori even
      # by accident. The order is the point: built with those packages present, a stray Satori
      # import would compile into /material and the comparison would be against something the
      # public site never serves. This is what the public workflow does for the same build, so
      # /material is the real thing and a Satori import fails it here too.
      - name: Hide GitHub Packages before the Material build
        shell: bash
        run: |
          set -euo pipefail
          hidden="$RUNNER_TEMP/github-packages-scopes"
          mkdir -p "$hidden"
          for scope in @hylandsoftware @alfresco; do
            if [ -e "source/node_modules/$scope" ]; then mv "source/node_modules/$scope" "$hidden"/; fi
          done

      - name: Build the Material Storybook without GitHub Packages
        working-directory: source
        run: npx nx run satori-components:build-storybook:ci --skip-nx-cache

      # Refuses a missing or empty Storybook, so a renamed outputDir cannot publish a blank site.
      - name: Assemble the site
        run: node scripts/assemble-site.mjs --source source --out _site --template site/index.html
        env:
          SOURCE_REF: ${{ inputs.ref || 'main' }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # Before the bytes leave the runner.
      - name: Assert the destination is private
        run: node scripts/assert-private.mjs "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Only for the guard script. The build job's pass was a moment ago and on a different runner;
      # this job is the one that actually publishes, so it asks again rather than inheriting a
      # verdict. Visibility can change between the two.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - name: Assert the destination is private
        run: node scripts/assert-private.mjs "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
