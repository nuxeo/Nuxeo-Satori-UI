<div class="queue-list">
  @if (items().length === 0) {
    <div class="queue-empty">
      <mat-icon svgIcon="search" />
      <p>{{ 'assets.assets-queue.no-asset-results' | translate }}</p>
    </div>
  } @else {
    @for (item of items(); track item.id) {
      <button
        type="button"
        class="queue-item"
        [class.active]="item.id === selectedItemId()"
        (click)="onItemClick(item)"
      >
        <div class="queue-item-preview">
          @if (thumbnailFor(item.id); as preview) {
            <img [src]="preview" [alt]="item.title" class="queue-item-image" />
          } @else {
            <mat-icon class="queue-item-icon" [svgIcon]="item.icon || 'page'" />
          }
        </div>
        <div class="queue-item-content">
          <h4 class="queue-item-title">{{ item.title }}</h4>
        </div>
      </button>
    }
  }
</div>
