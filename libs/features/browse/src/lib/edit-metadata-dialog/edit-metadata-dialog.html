<h2 mat-dialog-title>{{ 'browse.edit-metadata-dialog.edit' | translate }}</h2>

<mat-dialog-content ngForm #metadataForm="ngForm">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>{{ 'browse.edit-metadata-dialog.title' | translate }}</mat-label>
    <input matInput name="title" [(ngModel)]="title" required />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>{{ 'browse.edit-metadata-dialog.description' | translate }}</mat-label>
    <textarea matInput name="description" [(ngModel)]="description" rows="2"></textarea>
  </mat-form-field>

  <nxs-vocabulary-select
    class="full-width"
    directory="nature"
    [label]="'browse.edit-metadata-dialog.nature' | translate"
    name="nature"
    [(ngModel)]="nature"
  />

  <nxs-vocabulary-select
    class="full-width"
    directory="l10nsubjects"
    [label]="'browse.edit-metadata-dialog.subjects' | translate"
    name="subjects"
    [(ngModel)]="subjects"
    multiple
  />

  <nxs-vocabulary-select
    class="full-width"
    directory="l10ncoverage"
    [label]="'browse.edit-metadata-dialog.coverage' | translate"
    name="coverage"
    [(ngModel)]="coverage"
  />

  <nxs-date-input
    class="full-width"
    [label]="'browse.edit-metadata-dialog.expires' | translate"
    name="expires"
    [(ngModel)]="expires"
  />
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button mat-dialog-close [disabled]="saving()">
    {{ 'browse.edit-metadata-dialog.cancel' | translate }}
  </button>
  <button
    mat-flat-button
    color="primary"
    [disabled]="saving() || !title.trim() || metadataForm.invalid || !isExpiresValid()"
    (click)="save()"
  >
    @if (saving()) {
      <mat-spinner diameter="18" />
    } @else {
      {{ 'browse.edit-metadata-dialog.save' | translate }}
    }
  </button>
</mat-dialog-actions>
