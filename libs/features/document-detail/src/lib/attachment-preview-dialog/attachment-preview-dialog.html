<div class="preview-viewer">
  <div class="viewer-header">
    <span class="viewer-filename">{{ data.name }}</span>
    <button
      class="viewer-close"
      (click)="close()"
      [matTooltip]="'document-detail.attachment-preview-dialog.close' | translate"
    >
      <mat-icon svgIcon="x_large" />
    </button>
  </div>

  <div class="viewer-body">
    @if (isImage) {
      <img
        [src]="data.blobUrl"
        [alt]="data.name"
        class="viewer-img"
        [style.transform]="'scale(' + zoom() + ')'"
      />
    } @else if (isPdf) {
      <!-- `title` is the iframe's accessible name; without it a screen reader announces only "frame". -->
      <iframe [src]="data.blobUrl" [title]="data.name" class="viewer-frame"></iframe>
    } @else if (isVideo) {
      <video controls class="viewer-video">
        <!--
          data.rawUrl, not data.blobUrl: source[src] is SecurityContext.NONE, so no sanitizer
          runs, the SafeResourceUrl is never unwrapped, and toString() writes
          "SafeValue must use [property]=binding: …" into src. Video and audio attachment
          previews were broken exactly that way.
        -->
        <source [src]="data.rawUrl" [type]="sourceType" />
      </video>
    } @else if (isAudio) {
      <audio controls class="viewer-audio">
        <source [src]="data.rawUrl" [type]="sourceType" />
      </audio>
    } @else if (isText) {
      <iframe [src]="data.blobUrl" [title]="data.name" class="viewer-frame"></iframe>
    } @else {
      <div class="viewer-unsupported">
        <mat-icon class="unsupported-icon" svgIcon="page" />
        <p>
          {{
            'document-detail.attachment-preview-dialog.preview-not-available-for-this-file'
              | translate
          }}
        </p>
        <p class="mime-label">{{ data.mimeType }}</p>
      </div>
    }
  </div>

  @if (isImage) {
    <div class="viewer-toolbar">
      <button
        mat-icon-button
        [matTooltip]="'document-detail.attachment-preview-dialog.zoom-in' | translate"
        (click)="zoomIn()"
      >
        <mat-icon svgIcon="zoom_in" />
      </button>
      <button
        mat-icon-button
        [matTooltip]="'document-detail.attachment-preview-dialog.fit-to-screen' | translate"
        (click)="zoomReset()"
      >
        <mat-icon svgIcon="crop" />
      </button>
      <button
        mat-icon-button
        [matTooltip]="'document-detail.attachment-preview-dialog.zoom-out' | translate"
        (click)="zoomOut()"
      >
        <mat-icon svgIcon="zoom_out" />
      </button>
      <button
        mat-icon-button
        [matTooltip]="'document-detail.attachment-preview-dialog.rotate-left' | translate"
        (click)="rotateLeft()"
      >
        <mat-icon svgIcon="rotate_left" />
      </button>
      <button
        mat-icon-button
        [matTooltip]="'document-detail.attachment-preview-dialog.rotate-right' | translate"
        (click)="rotateRight()"
      >
        <mat-icon svgIcon="rotate_right" />
      </button>
    </div>
  }
</div>
