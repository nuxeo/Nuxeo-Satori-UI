<h2 mat-dialog-title>{{ 'document-detail.edit-document-dialog.edit-document' | translate }}</h2>

<mat-dialog-content>
  @if (saveError(); as message) {
    <div class="edit-document-dialog__error" role="alert">
      <mat-icon aria-hidden="true">error</mat-icon>
      <span>{{ message }}</span>
    </div>
  }
  <lib-document-layout-form
    mode="edit"
    [document]="data.document"
    [disabled]="saving()"
    [headingLevel]="3"
  />
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-stroked-button mat-dialog-close [disabled]="saving()">
    {{ 'document-detail.edit-document-dialog.cancel' | translate }}
  </button>
  <span class="edit-document-dialog__spacer"></span>
  <button mat-flat-button color="primary" [disabled]="saving()" (click)="save()">
    @if (saving()) {
      <mat-spinner
        diameter="18"
        [attr.aria-label]="'document-detail.edit-document-dialog.saving' | translate"
      />
    } @else {
      {{ 'document-detail.edit-document-dialog.save' | translate }}
    }
  </button>
</mat-dialog-actions>
