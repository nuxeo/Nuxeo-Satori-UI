<div class="results-page">
  <sat-header-bar variant="one-row">
    {{ 'trash.trash.search-results' | translate }}
    <div sat-header-bar-trailing class="page-header-actions">
      <button mat-flat-button class="save-as-btn" [disabled]="saving()" (click)="saveAsSearch()">
        <mat-icon svgIcon="bookmark" />
        {{ 'trash.trash.save-as' | translate }}
      </button>
      @if (trashFilterService.hasSavedFilter()) {
        <button mat-flat-button class="save-btn" [disabled]="saving()" (click)="saveSearch()">
          <mat-icon svgIcon="bookmark" />
          {{ 'trash.trash.save' | translate }}
        </button>
        <button
          mat-icon-button
          type="button"
          [matMenuTriggerFor]="resultsActionsMenu"
          [attr.aria-label]="'trash.trash.results-actions' | translate"
        >
          <mat-icon svgIcon="more_vert" />
        </button>
        <mat-menu #resultsActionsMenu="matMenu">
          <button mat-menu-item type="button" (click)="onEditSelectedSavedSearch()">
            {{ 'trash.trash.edit' | translate }}
          </button>
          <button mat-menu-item type="button" (click)="onShareSelectedSavedSearch()">
            {{ 'trash.trash.share' | translate }}
          </button>
          <button mat-menu-item type="button" (click)="onDeleteSelectedSavedSearch()">
            {{ 'trash.trash.delete' | translate }}
          </button>
        </mat-menu>
      }
    </div>
  </sat-header-bar>

  <!-- One sized box for the outlet and its fallback, so an unresolved outlet takes no height. -->
  <div class="trash-list">
    <lib-extension-outlet #list [componentId]="listId" [componentInputs]="listInputs()" />
    @if (list.unresolved()) {
      <nxs-trash-list
        [filters]="listInputs().filters"
        [openHandler]="listInputs().openHandler"
        [resultsHandler]="listInputs().resultsHandler"
      />
    }
  </div>
</div>
