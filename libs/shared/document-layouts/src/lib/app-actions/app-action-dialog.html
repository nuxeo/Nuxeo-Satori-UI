<nxs-dialog [heading]="data.title">
  <div class="lib-app-action">
    <p class="lib-app-action__question" [id]="questionId">{{ data.question }}</p>
    @if (data.form; as form) {
      <lib-document-layout-form
        class="lib-app-action__form"
        mode="task"
        [preview]="form"
        [document]="data.document"
        [disabled]="running()"
        [headingLevel]="3"
      />
    }
    @if (failure(); as message) {
      <nxs-banner
        class="lib-app-action__failure"
        tone="error"
        announce="alert"
        [message]="message"
      />
    }
    @if (running()) {
      <p class="lib-app-action__running" role="status">
        {{ 'document-layouts.action.running' | translate }}
      </p>
    }
  </div>
  <ng-container nxsDialogActions>
    <nxs-button data-app-action-cancel [disabled]="running()" (press)="cancel()">
      {{ 'document-layouts.action.cancel' | translate }}
    </nxs-button>
    <nxs-button
      appearance="filled"
      data-app-action-run
      [describedBy]="questionId"
      [disabled]="running() || unanswered()"
      (press)="confirm()"
    >
      {{ data.title }}
    </nxs-button>
  </ng-container>
</nxs-dialog>
