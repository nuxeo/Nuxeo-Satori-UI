@if (windowNotice(); as notice) {
  <nxs-banner class="record-list__window" tone="info" [message]="notice" />
}
<nxs-document-list
  class="record-list"
  [documents]="documents()"
  [columns]="columns()"
  [label]="label()"
  [sort]="chosenSort()"
  [defaultSort]="defaultSort()"
  [selectable]="selectable()"
  [(selectedIds)]="selectedIds"
  [pageIndex]="pageIndex()"
  [pageSize]="list().pageSize"
  [totalSize]="totalSize()"
  [totalMoreThan]="totalMoreThan()"
  [hasNextPage]="hasNextPage()"
  [loading]="loading()"
  [error]="error()"
  [emptyHeading]="emptyHeading() ?? ('document-layouts.related.empty' | translate)"
  [stateHeadingLevel]="stateHeadingLevel()"
  [rowActions]="rowMenus()"
  (sortChange)="onSort($event)"
  (pageChange)="onPage($event)"
  (open)="onOpen($event)"
  (rowAction)="onRowAction($event)"
  (retry)="onRetry()"
/>
