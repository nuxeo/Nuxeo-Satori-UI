<nxs-document-list
  class="record-list"
  [documents]="documents()"
  [columns]="columns()"
  [label]="label()"
  [sort]="chosenSort()"
  [defaultSort]="defaultSort()"
  [selectable]="false"
  [pageIndex]="pageIndex()"
  [pageSize]="list().pageSize"
  [totalSize]="totalSize()"
  [hasNextPage]="hasNextPage()"
  [loading]="loading()"
  [error]="error()"
  [emptyHeading]="'document-layouts.related.empty' | translate"
  [stateHeadingLevel]="stateHeadingLevel()"
  [rowActions]="rowMenus()"
  (sortChange)="onSort($event)"
  (pageChange)="onPage($event)"
  (open)="onOpen($event)"
  (rowAction)="onRowAction($event)"
  (retry)="onRetry()"
/>
