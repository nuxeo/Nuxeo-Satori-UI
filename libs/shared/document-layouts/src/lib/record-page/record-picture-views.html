@let view = selected();
@if (view === null) {
  <nxs-empty-state
    icon="image"
    [heading]="'document-layouts.picture.none' | translate"
    [headingLevel]="stateHeadingLevel()"
  />
} @else {
  <figure class="record-picture__figure" [attr.data-view]="view.title">
    <div class="record-picture__frame" [attr.aria-busy]="imageUrl() === null && failure() === null">
      @if (imageUrl(); as url) {
        <!-- The stage is the picture's own box, so that what a host lays over it lies on the picture. -->
        <div class="record-picture__stage">
          <img
            class="record-picture__image"
            [src]="url"
            [alt]="
              'document-layouts.picture.alt'
                | translate: { title: document().title, view: view.title }
            "
          />
          <ng-content select="[libRecordPictureOverlay]" />
        </div>
      } @else if (refusal(); as refused) {
        <!-- The server's rights refused this view: their reason, never the client's guess. -->
        <nxs-banner
          class="record-picture__refusal"
          tone="error"
          announce="alert"
          [attr.data-refusal]="refused.reason"
          [message]="refused.key | translate: refused.params"
        />
      } @else if (failure(); as status) {
        <nxs-error-state
          [status]="status"
          [heading]="'document-layouts.picture.failed' | translate"
          [headingLevel]="stateHeadingLevel()"
          [retryable]="status === 500"
          (retry)="retry()"
        />
      } @else {
        <nxs-spinner diameter="32" [label]="'document-layouts.picture.loading' | translate" />
      }
    </div>
    @if (watermarked()) {
      <!-- The server sent this view marked for the reader: the asset's rights require it. -->
      <p class="record-picture__watermarked">
        {{ 'document-layouts.picture.watermarked' | translate }}
      </p>
    }
    <figcaption class="record-picture__caption">{{ caption(view) }}</figcaption>
  </figure>
  @if (views().length > 1) {
    <div
      class="record-picture__views"
      role="group"
      [attr.aria-label]="'document-layouts.picture.views' | translate"
    >
      @for (each of views(); track each.key) {
        <button
          mat-stroked-button
          type="button"
          class="record-picture__view"
          [attr.data-view]="each.title"
          [attr.aria-pressed]="each.key === view.key"
          (click)="choose(each)"
        >
          {{ each.title }}
          @if (size(each); as dimensions) {
            <span class="record-picture__view-size">{{ dimensions }}</span>
          }
        </button>
      }
    </div>
  }
}
