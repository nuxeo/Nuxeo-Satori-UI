<sat-navigation-tabs class="nxs-satori-tabs__strip" [attr.aria-label]="ownLabel() || null">
  @for (tab of tabs(); track tab.id; let index = $index) {
    <!-- `tabindex` is only the starting value: Satori's directive binds it, and the selected tab is
         made the strip's one tab stop. -->
    <a
      satNavigationTab
      tabindex="-1"
      class="nxs-satori-tabs__tab"
      [id]="tabId(index)"
      [active]="index === shown()"
      [attr.aria-controls]="shownBefore().has(tab.id) ? panelId(index) : null"
      [attr.data-tab-id]="tab.id"
      (click)="select(index)"
      (keydown.enter)="select(index)"
      (keydown.space)="$event.preventDefault(); select(index)"
    >
      @if (tab.icon) {
        <mat-icon class="nxs-satori-tabs__icon" aria-hidden="true" [svgIcon]="tab.icon" />
      }
      {{ tab.label }}
    </a>
  }
</sat-navigation-tabs>

<!-- A panel for each tab whose body has been shown, hidden while another is selected, so a body
     keeps its state when the user switches away and back, as Material's tab group does. -->
@for (tab of tabs(); track tab.id; let index = $index) {
  @if (shownBefore().has(tab.id)) {
    <div
      class="nxs-satori-tabs__panel"
      role="tabpanel"
      [id]="panelId(index)"
      [attr.aria-labelledby]="tabId(index)"
      [hidden]="index !== shown()"
    >
      @if (body(); as template) {
        <ng-container
          [ngTemplateOutlet]="template"
          [ngTemplateOutletContext]="{ $implicit: tab }"
        />
      }
    </div>
  }
}
