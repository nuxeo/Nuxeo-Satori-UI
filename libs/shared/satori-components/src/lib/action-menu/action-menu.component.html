@if (actions().length > 0) {
  @let name = ownLabel() || ('satori-components.action-menu.more-actions' | translate);
  <button
    mat-icon-button
    type="button"
    class="nxs-action-menu__trigger"
    [matMenuTriggerFor]="menu"
    [matTooltip]="name"
    [attr.aria-label]="name"
  >
    <mat-icon aria-hidden="true" [svgIcon]="icon()" />
  </button>
  <mat-menu #menu="matMenu">
    @for (action of actions(); track action.id) {
      <button
        mat-menu-item
        type="button"
        [attr.data-action-id]="action.id"
        [disabled]="action.disabled ?? false"
        (click)="selected.emit(action)"
      >
        @if (action.icon) {
          <mat-icon aria-hidden="true" [svgIcon]="action.icon" />
        }
        <span>{{ action.label }}</span>
      </button>
    }
  </mat-menu>
}
