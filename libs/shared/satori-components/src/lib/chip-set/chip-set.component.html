<mat-chip-set [attr.aria-label]="label() || null">
  @for (item of items(); track item.id) {
    <mat-chip [disabled]="item.disabled ?? false" (removed)="pressRemove(item)">
      {{ item.label }}
      <button
        type="button"
        matChipRemove
        [tabIndex]="0"
        [disabled]="item.disabled ?? false"
        [attr.aria-label]="item.removeLabel"
        (click)="$event.stopPropagation()"
        (keydown.enter)="$event.stopPropagation()"
        (keydown.space)="$event.stopPropagation()"
      >
        <mat-icon aria-hidden="true" svgIcon="circle_x" />
      </button>
    </mat-chip>
  }
</mat-chip-set>
