<mat-icon class="nxs-dropzone__icon" aria-hidden="true">upload_file</mat-icon>
<span class="nxs-dropzone__label">{{ label() }}</span>
<button
  mat-stroked-button
  type="button"
  class="nxs-dropzone__button"
  [disabled]="disabled()"
  (click)="choose()"
>
  {{
    buttonLabel().trim() ||
      ((multiple()
        ? 'satori-components.dropzone.choose-files'
        : 'satori-components.dropzone.choose-file'
      ) | translate)
  }}
</button>
<input
  #picker
  type="file"
  class="nxs-dropzone__input"
  tabindex="-1"
  aria-hidden="true"
  [multiple]="multiple()"
  [attr.accept]="accept() || null"
  [disabled]="disabled()"
  (change)="onPicked($event)"
/>
