<mat-tab-group
  class="nxs-tabs__group"
  animationDuration="0ms"
  [aria-label]="ownLabel()"
  [selectedIndex]="selectedIndex()"
  (selectedIndexChange)="select($event)"
  (selectedTabChange)="select($event.index)"
>
  @for (tab of tabs(); track tab.id) {
    <mat-tab>
      <ng-template mat-tab-label>
        <span class="nxs-tabs__label" [attr.data-tab-id]="tab.id">
          @if (tab.icon) {
            <mat-icon class="nxs-tabs__icon" aria-hidden="true" [svgIcon]="tab.icon" />
          }
          {{ tab.label }}
        </span>
      </ng-template>
      @if (bodyTemplate(); as template) {
        <ng-container
          [ngTemplateOutlet]="template"
          [ngTemplateOutletContext]="{ $implicit: tab }"
        />
      }
    </mat-tab>
  }
</mat-tab-group>
