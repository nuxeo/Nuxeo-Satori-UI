<mat-form-field class="nxs-text-field__field" subscriptSizing="dynamic" [appearance]="appearance()">
  <mat-label>{{ label() }}</mat-label>
  @if (multiline()) {
    <textarea
      #control
      matInput
      class="nxs-text-field__control"
      [id]="controlId()"
      [rows]="rows()"
      [placeholder]="placeholder()"
      [required]="required()"
      [attr.maxlength]="maxLength()"
      [value]="value()"
      [disabled]="disabled()"
      (input)="typed($event)"
      (change)="committed($event)"
    ></textarea>
  } @else {
    <input
      #control
      matInput
      class="nxs-text-field__control"
      [id]="controlId()"
      [type]="type()"
      [attr.min]="type() === 'number' ? min() : null"
      [attr.max]="type() === 'number' ? max() : null"
      [attr.step]="type() === 'number' ? step() : null"
      [attr.list]="suggestions().length > 0 ? listId : null"
      [attr.autocomplete]="autocomplete() || null"
      [placeholder]="placeholder()"
      [required]="required()"
      [attr.maxlength]="maxLength()"
      [value]="value()"
      [disabled]="disabled()"
      (input)="typed($event)"
      (change)="committed($event)"
    />
    @if (suggestions().length > 0) {
      <datalist [id]="listId">
        @for (suggestion of suggestions(); track suggestion) {
          <option [value]="suggestion"></option>
        }
      </datalist>
    }
  }
  @if (hint()) {
    <mat-hint [align]="hintAlign()">{{ hint() }}</mat-hint>
  }
</mat-form-field>
