<mat-form-field class="nxs-text-field__field" subscriptSizing="dynamic" [appearance]="appearance()">
  <mat-label>{{ label() }}</mat-label>
  @if (multiline()) {
    <textarea
      matInput
      class="nxs-text-field__control"
      [rows]="rows()"
      [placeholder]="placeholder()"
      [value]="value()"
      [disabled]="disabled()"
      (input)="typed($event)"
      (change)="committed($event)"
    ></textarea>
  } @else {
    <input
      matInput
      class="nxs-text-field__control"
      [attr.list]="suggestions().length > 0 ? listId : null"
      [attr.autocomplete]="autocomplete() || null"
      [placeholder]="placeholder()"
      [value]="value()"
      [disabled]="disabled()"
      (input)="typed($event)"
      (change)="committed($event)"
    />
    @if (suggestions().length > 0) {
      <datalist [id]="listId">
        @for (suggestion of suggestions(); track suggestion) {
          <option [value]="suggestion"></option>
        }
      </datalist>
    }
  }
</mat-form-field>
