<!--
  Host for the spec that asserts `provideSatoriDateAdapter()` overrides the adapter a component
  gets from `imports: [MatNativeDateModule]`. The datepicker has to be in the template so the
  component is compiled the way a real one is; the assertion reads the injected `DateAdapter`.
-->
<mat-form-field>
  <input matInput [matDatepicker]="picker" />
  <mat-datepicker-toggle matIconSuffix [for]="picker" />
  <mat-datepicker #picker />
</mat-form-field>
