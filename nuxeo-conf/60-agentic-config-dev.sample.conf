## The configuration development override directory (NXSAT-312).
##
## Without this, changing one configuration value on a deployed server costs a package rebuild, a
## version bump in package.xml, mp-install and a restart: two to four minutes, and the restart
## drops every open session on a shared demo box. With it, the configuration servlet reads a
## directory on this server's disk on every request, and the loop is: edit the file, reload the
## tab. Measured on this container: 0.1 s against 8.5 s for the restart alone.
##
## NEVER SET THIS IN PRODUCTION. It makes the UI configuration editable by anyone who can write to
## the server's filesystem. A regulated customer's position is that a configuration change needs
## the same privilege as deploying code, and this property is precisely the thing that would not
## be true of. It is for a development box or a demo box.
##
## The directory defaults to ${nuxeo.data.dir}/agentic-ui-config-dev and holds the same file names
## as a configuration package's bundle/agentic-ui-config/ — bootstrap[.<name>].json,
## manifest[.<name>].json, layouts/<Type>/<mode>.layout.json and assets/<file>. Overrides are
## applied after every package's fragments and are validated exactly as a package's are: a
## malformed one is rejected and reported, and the packaged fragment stays in force.
##
## The loop, the file naming and the two nuxeo sync limitations are documented in
## config-packages/presales-demo/README.md, "The fast loop while you are tuning a value".
##
## How to apply it depends on whether the container already exists, and getting that wrong is
## silent: the entrypoint merges conf.d into nuxeo.conf when the container is CREATED, not on
## `docker restart`, so the conf.d route on a running container leaves the override switched off
## with nothing to say so.
##
## On an ALREADY-RUNNING container, append the active line to nuxeo.conf and restart. Note that
## the property is written out in full here rather than copied from this file: every line below
## is commented out, so copying this file anywhere enables nothing by itself.
##
##   docker exec nuxeo sh -c 'echo nuxeo.agentic.ui.config.dev=true >> /etc/nuxeo/nuxeo.conf'
##   docker restart nuxeo
##
## When CREATING the container, conf.d is merged, so the fragment can be mounted or copied in
## before first start. Copy this file, uncomment the property in the copy, and mount it:
##
##   cp nuxeo-conf/60-agentic-config-dev.sample.conf nuxeo-conf/60-agentic-config-dev.conf
##   # then edit that copy and uncomment the nuxeo.agentic.ui.config.dev line
##   docker run ... -v "$PWD/nuxeo-conf/60-agentic-config-dev.conf:/etc/nuxeo/conf.d/60-dev.conf"
##
## Confirm it took, rather than assuming — the servlet logs a warning naming the directory at
## startup, and nothing at all when the override is off:
##
##   docker logs nuxeo 2>&1 | grep "DEVELOPMENT OVERRIDES ARE ACTIVE"
##
## Then, once, because the server reports the directory as absent rather than creating it and a
## single-file `docker cp` into a missing parent fails:
##
##   docker exec nuxeo mkdir -p /var/lib/nuxeo/agentic-ui-config-dev
##
## And per edit:
##
##   docker cp bundle/agentic-ui-config/bootstrap.json \
##     nuxeo:/var/lib/nuxeo/agentic-ui-config-dev/bootstrap.json

# nuxeo.agentic.ui.config.dev=true

## Optional. Only read when the switch above is true; on its own it does nothing.
# nuxeo.agentic.ui.config.dev.dir=/var/lib/nuxeo/agentic-ui-config-dev
